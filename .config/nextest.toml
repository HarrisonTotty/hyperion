[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=stellar::rules::awd_donors_hold::the_helium_fed_hosts_leave_the_fast_class_in_a_census)"
threads-required = 16

# R06.T5.f's realised sky (`sky_realised`) runs its jobs on eight threads of its own too.
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & (binary(=sky_census) | binary(=sky_realised))"
threads-required = 8

# R13.T1's record of the hybrid sky's real boundary measures its six points on six threads of its
# own, one a point, each counting the caps at seven cuts and recounting 3,072 rays at ten.
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(=sky_hybrid) & test(=the_hybrid_boundary_is_recorded)"
threads-required = 6

# R13.T1.b's record of the boundary held within the real limit measures the same six points on six
