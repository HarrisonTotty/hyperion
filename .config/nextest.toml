# cargo-nextest, which `just test-slow` runs the slow tests under. Unlike `cargo test`, which runs
# its test binaries one after another and so leaves most cores idle while a binary with one long
# test finishes, nextest schedules every test of every binary on one pool of `num-cpus` slots.
#
# Each test runs in its own process, so a `OnceLock` shared between tests is built once per test,
# not once per binary: slow tests that would share expensive data are written as one test instead.

# Every test that reads the sky's luminosity tables builds its own copy, since each test runs in its
# own process. On 2026-10-03 sixteen of them at once, at about 2 GB a build, beside other lanes'
# builds, exhausted the machine's 32 GB and froze it, so every such test is in this group. Building
# one metallicity at a time (a934837) cut a build to about 300 MiB (2026-10-05), so the group now
# runs six at a time: about 2 GB together.
[test-groups]
sky-tables = { max-threads = 6 }

[[profile.default.overrides]]
filter = "package(hyperion-sim) & (test(/^sky::(luminosity|caps|census|envelope|band|limits|dgl)/) | binary(/^sky_/))"
test-group = "sky-tables"

# The sky census's identity tests run the census and its oracle on eight threads of their own
# (`THREADS` in `tests/common/sky.rs`), so each takes eight slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & binary(=sky_census)"
threads-required = 8

# Two of the sky's band tests run their census's cells on four threads of their own, so each takes
# four slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & (test(=sky::limits::tests::the_eyes_light_is_independent_of_the_census_radius) | test(=sky::band::tests::one_marchs_light_at_100_200_and_400_ly_agrees_within_1_percent))"
threads-required = 4

# R06.T11.c's near-Sun sky builds the galaxy's luminosity tables twice, on the server's pool and
# serially in the test, and marches its band on three threads of its own beside the server's three
# workers, so it takes four slots and joins the tables' group.
[[profile.default.overrides]]
filter = "package(hyperion-server) & binary(=sky) & test(=a_sky_near_the_sun_returns_the_stars_texels_and_host_discs_the_sim_returns)"
test-group = "sky-tables"
threads-required = 4

# The hierarchy bound's tests (P11.T16) check their records on four threads of their own, so each
# takes four slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & test(/^stellar::multiplicity::bound::tests::the_(bound_holds|hierarchy_bound_holds)/)"
threads-required = 4

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & (test(/^sky::(luminosity|caps|census|envelope|band|limits|dgl)/) | binary(/^sky_/))"
test-group = "sky-tables"

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=stellar::multiplicity::bound::tests::the_hierarchy_bound_holds_for_generated_systems)"
threads-required = 4

# The census's bound star by star (R06.T8.g) checks its realised systems on four threads of its
# own, in its fast test and its slow one, so each takes four slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & test(=sky::census::cell::tests::the_star_bound_holds_for_some_realised_systems)"
threads-required = 4

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=sky::census::cell::tests::the_star_bound_holds_for_realised_systems)"
threads-required = 4

# R06.T5.f's realised sky (`sky_realised`) runs its jobs on eight threads of its own too.
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & (binary(=sky_census) | binary(=sky_realised))"
threads-required = 8

[profile.slow]
# Report every failure of a 20-minute run, not only the first.
fail-fast = false
# A slow test is flagged after 2 minutes; none is ever killed.
slow-timeout = "120s"

# The budget of the 512-pixel density maps is stated in `math::exp` calls timed at the pool's
# width, and the test asserts that the pool is seen running a band on every worker at once. It
# takes every slot, so it runs alone rather than contending with the other slow tests.
[[profile.slow.overrides]]
filter = "package(hyperion-server) & binary(density_map) & test(=density_map_512_builds_within_budget)"
threads-required = "num-cpus"

# Nextest starts tests in binary order, so without priorities the longest ones could start ten
# minutes in and then run alone for the last quarter of an hour. Higher priorities start sooner
# (-100 to 100); the order follows each test's slot time in the slow-test audit of 2026-09-27,
# longest first. The flared hunt is four shards of about a quarter of its old time each.
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(galaxy_sweeps) & test(=the_rotation_curve_over_four_thousand_seeds)"
priority = 100

# The million-system satellite check shares its cells among its own threads: it takes four slots
# rather than a nominal one, so its threads do not slow the tests beside it, and it is capped at
# four threads to match (`check_all` in `planetary_properties.rs`).
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(planetary_properties) & test(=satellites::moons_inside_hill_spheres_and_rings_inside_roche_limits_slow)"
threads-required = 4
priority = 90

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(galaxy_sweeps) & (test(=the_fields_over_a_thousand_seeds) | test(=the_densities_over_a_thousand_seeds))"
priority = 80

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(galaxy_displaced_bounds) & test(/^hunt_flared_violations_in_the_inner_galaxy/)"
priority = 70

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(galaxy_sweeps) & test(=every_getter_lies_in_its_range_and_sizes_follow_the_cube_root_over_ten_thousand_seeds)"
priority = 60

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(gas_statistics) & test(=the_neutral_disc_holds_most_of_the_gas_over_2000_galaxies)"
priority = 60
