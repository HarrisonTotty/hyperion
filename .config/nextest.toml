[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(/^galaxy::placement::fates_hold::the_two_arms_remnants_have_alike_masses_and_deaths_through_the_stellar_stage$/)"
threads-required = 4

# P11.T5's helium-donor hold runs its two censuses of 10⁶ records on sixteen threads of their own
