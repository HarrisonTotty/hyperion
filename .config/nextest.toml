[[profile.slow.overrides]]
filter = "package(hyperion-server) & test(=requests::galaxy::registration::from_27_a_range_query_serves_the_list_s_members_and_the_centre_s)"
threads-required = 8

# P11.T17.c's verdicts against the engine check their pairs on eight threads of their own.
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=stellar::binary::light::tests::the_pair_verdicts_hold_against_the_engine)"
threads-required = 8

# P15.T10.b's fitted samplers against the engine run their census of 10⁷ records through the
