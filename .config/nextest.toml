# cargo-nextest, which `just test-slow` runs the slow tests under. Unlike `cargo test`, which runs
# its test binaries one after another and so leaves most cores idle while a binary with one long
# test finishes, nextest schedules every test of every binary on one pool of `num-cpus` slots.
#
# Each test runs in its own process, so a `OnceLock` shared between tests is built once per test,
# not once per binary: slow tests that would share expensive data are written as one test instead.
#
# A test's `threads-required` is capped at the run's test threads. nextest's scheduler (future-queue
# 0.4.0, under nextest 0.9.150) sets a weight above the pool's size to the pool's size, so a test
# reserving 8 slots at `--test-threads 4` (or `NEXTEST_TEST_THREADS=4`) holds all 4 and runs alone,
# and running 8 threads of its own it would put 8 on 4 slots (checked on 2026-10-29). So the tests
# below that run threads of their own run no more than they hold: `hyperion_testkit::threads`'s
# `granted(n)` gives a test reserving n slots the fewer of n and the run's test threads, which
# nextest gives every test process as `NEXTEST_TEST_THREADS` (since 0.9.130), and `in_shares` runs
# a test's fixed shares of work on that many. Their results are the same on any number of threads,
# as each pool's documentation says. Each reservation below is the most threads its test runs, and
# the test states the same number in its code: change the two together. Not capped, as each runs a
# fixed number of threads, each with a part of its own: the server's tests that run threads beside
# the server's own workers (the near-Sun sky, the caps' counts at the ceiling, the range query's
# reference) and the nuclear disc's slow quadrants, which reserve 4 or fewer, and the density map's
# budget, which takes every slot to measure every worker at once; each holds what it runs on any run
# of at least that many test threads. An older nextest, which gives the tests no
# `NEXTEST_TEST_THREADS`, warns.
nextest-version = { recommended = "0.9.130" }

# The protocol's `export_bindings_*` tests write the checked-in bindings (`TS_RS_EXPORT_DIR`,
# `.cargo/config.toml`), and ts-rs 12 fsyncs each file it writes. In nextest's process per test each
# rewrites its type's whole closure of imports: 1,432 fsynced writes a run, where `cargo test`'s one
# process writes 143. In integration's `ci` of 2026-10-10 they took 2,118 test-seconds, with other
# worktrees building beside it, against 1.4 s for the protocol's 203 other tests.
# `just gen-protocol-check` runs them all, in one process under `cargo test`, into a temporary
# directory and diffs that with the committed bindings, so nextest skips them. Filters on the
# command line (`-p`, `-E`, test names) select within this set, and `--ignore-default-filter` lifts
# it. The `slow` profile inherits it; a profile that sets its own `default-filter` replaces it.
[profile.default]
default-filter = "not (package(hyperion-protocol) & test(/export_bindings/))"

# Each run's JUnit report, with every test's start time and duration, in
# `target/nextest/<profile>/junit.xml`, from which a log's suites can be read for their wall time
# and their use of the cores (perf-build.md Q4 and L6). Every profile inherits it.
[profile.default.junit]
path = "junit.xml"

# The wasip1 suites' profile, which `just _wasip1` names (`NEXTEST_PROFILE`, unless a run gives its
# own `--profile`): the default one, whose settings and overrides every profile inherits, under a
# name of its own, so that the wasip1 run's report does not replace the native run's, which `ci`
# makes just before it in the same hold of the heavy-test lock.
[profile.wasip1]

# wasm32-wasip1 has no threads, so there every test runs on one: the sky's census and oracle helpers
# and the bound checks run their jobs in turn (`THREADS` is 1 in `tests/common/sky.rs`; the others
# branch on `target_family = "wasm"`). So under wasip1 each test takes one slot, whatever it
# reserves natively below, and the sky's tests leave the tables' memory group for the whole pool:
# measured on 2026-10-11 under the heavy lock, most wasip1 sky tests peak at 100–200 MiB of
# wasmtime, the heaviest at 807 MiB, and the run's sixteen heaviest come to 5.0 GiB together; a
# whole wasip1 fast run on the whole pool peaked at 3.1 GiB in its scope, within the 8 GB that
# `decision-test-coverage.md` §4 allows. Being first, this override wins over the native ones for
# these two settings (nextest takes, for each setting, the first matching override that sets it);
# the group's priority below still applies. The slow profile's own overrides are checked before it,
# so `test-wasm-slow` keeps their group and their reservations. The next override, the sky census's
# own, came first and gives its tests the same one slot.
[[profile.default.overrides]]
platform = 'cfg(target_family = "wasm")'
threads-required = 1
test-group = "@global"

# On WebAssembly, which has no threads, the sky census's identity tests run on one (`THREADS`), so
# they take one slot there (the override below sets eight elsewhere; the first that matches wins).
# At eight, more than their group's six, nextest 0.9.146 left them unrun in `ci`'s wasip1 run once
# `wasm_sky` had thinned the group (2026-10-11): a test queued behind its full group is taken up
# again only when another test of the group ends, and only if the whole pool has room for it then
# (future-queue 0.4.0), so when the group's last other test ended with more than eight slots busy,
# they never ran.
[[profile.default.overrides]]
platform = 'cfg(target_arch = "wasm32")'
filter = "package(hyperion-sim) & binary(=sky_census)"
threads-required = 1

# The sky's tests that read its luminosity tables are in this group. Each test runs in its own
# process, and each once built its own copy of the tables: on 2026-10-03 sixteen of them at once, at
# about 2 GB a build, beside other lanes' builds, exhausted the machine's 32 GB and froze it.
# Building one metallicity at a time (a934837) cut a build to about 300 MiB (2026-10-05), and now
# one process a run builds them and the others read its file (`sky::testing::shared`). Measured
# natively on 2026-10-11 under the heavy lock (each test process's peak RSS): most of the group's
# tests 100–200 MiB, the heaviest 671 MiB (`census::query`'s plan at a ceiling), the heaviest others
# 349, 180, 166 and 147 MiB. Twelve at once, each as heavy as the heaviest, beside those four, come
# to 8.7 GiB: under three quarters of the lanes' 12 GiB heavy-test cap (`HEAVY_MEMORY_MAX`), where
# sixteen would not be (10.5 GiB). A whole native fast run at twelve peaked at 1.3 GiB in its scope,
# under the half of that cap which `decision-test-coverage.md` §4 allows.
[test-groups]
sky-tables = { max-threads = 12 }
# The slow tier's sky tests (the census's oracles, the realised sky, the hybrid boundary) keep the
# group's old limit of six, in a group of their own, on both targets, until the slow pass has
# measured their memory (`decision-test-coverage.md` §4).
sky-tables-slow = { max-threads = 6 }

# The sky's tests below run on threads of their own and reserve those slots, so they stay out of the
# group, in the whole pool, and start as early as it does. nextest 0.9.146's scheduler (future-queue
# 0.4.0's `future_queue_grouped`) starts a test queued behind its full group only when another of
# the group's tests finishes, and only if the pool then has room for all its slots; the first queued
# test that does not fit holds back the rest. So a test of 4 or 8 slots queued as the group drains,
# while other tests fill the pool, never starts: `sky_census`'s six fast tests were left unrun that
# way in a whole native run on 2026-10-11, as four were on wasip1 (lane wasm-coverage). A one-slot
# test always fits the slot its finishing group-mate frees, so the group holds only those. These
# tests peak at 9–324 MiB a process, 81 MiB or less a slot, within the group's memory arithmetic
# above.
#
# The sky census's identity tests run the census and its oracle on eight threads of their own
# (`THREADS` in `tests/common/sky.rs`), so each takes eight slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & binary(=sky_census)"
threads-required = 8
test-group = "@global"
priority = 50

# Two of the sky's band tests run their census's cells on four threads of their own, so each takes
# four slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & (test(=sky::limits::tests::the_eyes_light_is_independent_of_the_census_radius) | test(=sky::band::tests::one_marchs_light_at_100_200_and_400_ly_agrees_within_1_percent))"
threads-required = 4
test-group = "@global"
priority = 50

# The crust entries' census over the 400 sample systems (R09.T10.c) reads their records on four
# threads of its own.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & test(=planetary::surface::tests::no_generated_cell_lacks_its_crust_s_entry)"
threads-required = 4
test-group = "@global"
priority = 50

# The shell plan's census tests (R06.T8.i), and the census's at a synthetic ceiling (R13.T2.a),
# census their cells on four threads of their own too.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & (test(=sky::census::query::tests::shells_merged_are_the_census_to_each_edge_and_the_last_is_the_plans) | test(=sky::census::query::tests::by_ray_shells_merged_hold_the_census_to_each_shells_radii) | test(=sky::census::query::tests::at_a_ceiling_shells_merged_are_the_census_forced_to_the_real_boundary) | test(=sky::census::query::tests::at_a_ceiling_every_star_within_its_texels_real_boundary_is_listed))"
threads-required = 4
test-group = "@global"
priority = 50

# The census's bound star by star (R06.T8.g) checks its realised systems on four threads of its own,
# in its fast test and its slow one (below), so each takes four slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & test(=sky::census::cell::tests::the_star_bound_holds_for_some_realised_systems)"
threads-required = 4
test-group = "@global"
priority = 50

# R06.T11.c's near-Sun sky builds the galaxy's luminosity tables twice, on the server's pool and
# serially in the test, and marches its band on three threads of its own beside the server's three
# workers, so it takes four slots, starting as early as the group.
[[profile.default.overrides]]
filter = "package(hyperion-server) & binary(=sky) & test(=a_sky_near_the_sun_returns_the_stars_texels_and_host_discs_the_sim_returns)"
threads-required = 4
priority = 50

# R13.T2.b's real boundary in jobs builds the server's galaxy's luminosity tables on its pool of
# three workers, as the server builds them (`build_on_pool`), counts the caps' rays in jobs on that
# pool beside its runtime's threads, and runs the sim's three references on threads of their own, so
# it takes four slots, starting as early as the group.
[[profile.default.overrides]]
filter = "package(hyperion-server) & test(=compute::sky::tests::at_the_ceiling_the_caps_counts_in_jobs_are_the_sims_real_boundary)"
threads-required = 4
priority = 50

# The group's tests start first. They are the fast tier's longest (40–160 s each natively, up to
# about 300 s on wasip1, where most tests take seconds), and in binary order they started after most
# of the sim's tests and ran on alone at the end of each run (`perf-sim-sky.md`, 2026-10-10).
[[profile.default.overrides]]
filter = "package(hyperion-sim) & (test(/^sky::(luminosity|caps|census|envelope|band|limits|dgl|pins)/) | binary(/^sky_/))"
test-group = "sky-tables"
priority = 50

# The hierarchy bound's tests (P11.T16) check their records on four threads of their own, so each
# takes four slots rather than a nominal one.
[[profile.default.overrides]]
filter = "package(hyperion-sim) & test(/^stellar::multiplicity::bound::tests::the_(bound_holds|hierarchy_bound_holds)/)"
threads-required = 4

# The range query's merged properties build their reference galaxy on a thread of their own, beside
# the server's build of it, so the test takes two slots.
[[profile.default.overrides]]
filter = "package(hyperion-server) & binary(=systems_in_range) & test(=the_range_query_answers_as_the_sim_and_refuses_what_it_cannot_use)"
threads-required = 2

# The nuclear disc's slow identity test is four, one for each quadrant about its place
# (`sky_census.rs`), each holding a cell of D and one of E and running on three threads of its own:
# E's census, E's oracle, and D's census then D's oracle. So each takes three slots, not the eight
# of the census's other tests below, and while the slow tier's memory is unmeasured, three holds
# the group to two of them at once, four of the old test's eight cells. At eight, more than the
# group's six, a test takes the whole group (future-queue 0.4.0 holds a test's weight to its
# group's limit), so the four would run one after another. Measured on 2026-10-13 on an 8-thread
# i7-8665U, two at a time: each process peaked at 123 MiB or less, and the run's scope, with both,
# at 252 MiB (`memory.peak`). They start after the group's six- and eight-slot tests, at a priority
# below the group's, against the slow tier's longest-first order until the slow group is
# revisited: a test queued behind its full group starts only when another of the group ends, and
# only if the pool then has room for all its slots (the default profile's overrides), so a
# three-slot test ending last could strand an eight-slot one queued behind it, which nextest then
# reports as not run. Queued behind those, a quadrant follows only a test at least as heavy as
# itself. Being first, this override's priority wins over the group's next, and its slots over the
# census's own below; it sets nothing else, and the group is the next one's.
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & binary(=sky_census) & test(/^the_census_is_its_oracle_for_d_and_e_in_the_nuclear_disc_/)"
threads-required = 3
priority = -10

# The slow tier's sky tests keep the group's old limit (`sky-tables-slow`) and the slow tier's order
# below: the priority the default profile gives the fast tier's group does not reach them. The slow
# tier's slots and group stay as they were until its own memory is measured (2026-10-11).
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & (test(/^sky::(luminosity|caps|census|envelope|band|limits|dgl|pins)/) | binary(/^sky_/))"
test-group = "sky-tables-slow"
priority = 0

# So this census test keeps the four slots it held in `test-wasm-slow`, which runs it (it is ignored
# as slow on wasm32-wasip1 only), rather than the one slot of the wasip1 override above.
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=sky::census::query::tests::at_a_ceiling_every_star_within_its_texels_real_boundary_is_listed)"
threads-required = 4

[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=stellar::multiplicity::bound::tests::the_hierarchy_bound_holds_for_generated_systems)"
threads-required = 4

# The census's bound star by star in the slow tier, on four threads of its own (its fast test
# above).
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=sky::census::cell::tests::the_star_bound_holds_for_realised_systems)"
threads-required = 4

# P10.T12's budget sweep, its drawn galaxy's tubes and option A's tripwire build galaxies and spray
# their streams on eight threads of their own (`global_list::statistics`'s `THREADS`).
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(/^galaxy::global_list::statistics::(the_discrete_share_s_budgets_hold_over_the_sweep|a_drawn_galaxy_s_tubes_and_contrast_keep_their_measured_figures|option_a_drops_a_bounded_share_over_the_sweep)$/)"
threads-required = 8

# P10.T10.b's warm-up at Milky Way values builds every tube table on a pool of eight workers of its
# own (`compute::global_list`'s test of it).
[[profile.slow.overrides]]
filter = "package(hyperion-server) & test(=compute::global_list::tests::the_warm_up_readies_every_track_and_a_range_query_finds_a_stream_s_members)"
threads-required = 8

# P10.T12's millennium test sprays its three test streams on three threads of their own
# (`global_list::statistics`'s `SPRAY_THREADS`).
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=galaxy::global_list::statistics::the_test_streams_members_keep_to_their_tubes_over_a_millennium)"
threads-required = 3

# P09.T31's centre profile test follows its six shells on six threads of their own
# (`centre::over_time::SHELLS`).
[[profile.slow.overrides]]
filter = "package(hyperion-sim) & test(=galaxy::features::centre::over_time::the_centre_keeps_its_profile_and_flattening_over_a_millennium)"
threads-required = 6

# P10.T10.b's registration test serves its queries on a pool of eight workers of its own
