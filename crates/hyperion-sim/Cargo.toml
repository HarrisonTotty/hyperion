[package]
name = "hyperion-sim"
description = "Deterministic simulation and procedural generation core for HYPERION."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Benchmarks live under `benches/`; libtest's harness rejects Criterion's arguments.
bench = false

[dependencies]
# The foundation beneath the sim (`math`, `units`, `version`, `rng`), re-exported at their old
# paths; it brings the pinned `libm`, the only external runtime dependency.
hyperion-base.workspace = true
# The shared height function; the sim reads its tag registry now, to assert the three registries
# disjoint, and its height function once the flight model collides with terrain.
hyperion-surface.workspace = true

[features]
# Test helpers (`events::testing`, `planetary::testing`, `stellar::testing`) for this crate's tests
# and for other crates' tests.
testing = []

[dev-dependencies]
criterion.workspace = true
hyperion-testkit.workspace = true

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "galaxy"
harness = false

[[bench]]
name = "placement"
harness = false

[[bench]]
name = "range_query"
harness = false

[[bench]]
name = "stellar"
harness = false

[[bench]]
name = "events"
harness = false

[[bench]]
name = "gas"
harness = false

[[bench]]
