# Clippy configuration for `hyperion-fit`. Clippy takes the nearest `clippy.toml` and does not
# merge, so this repeats what it needs of `hyperion-sim`'s: a fitted table must come out the same
# on every platform, so every transcendental goes through `hyperion_sim::math` here too.

# Journal names and authors in citations, as the sim's `clippy.toml` has them.
doc-valid-idents = ["McKee", "LeVeque", "ApJ", "ApJS", ".."]

# Every transcendental function goes through `hyperion_sim::math` (`hyperion_base::math`), which
# wraps the exactly pinned `libm`. The platform's own versions differ between operating systems and
# CPU architectures, and a saved universe must survive being moved to another machine. That
# includes `mul_add`, which calls the platform's `fma` where the CPU has none. Float bits are never
# hashed, whether as an integer or as bytes, and the golden writer that prints them lives in
# `hyperion-testkit`.
#
# The `algebraic_*` methods (`algebraic_add`, `_sub`, `_mul`, `_div` and `_rem`, on `f64` and `f32`)
# license the compiler to fuse, reassociate and otherwise rewrite float arithmetic as if it were
# real arithmetic. Rust's documentation of them ("Algebraic operators", `core`'s
# `primitive_docs.rs`, rustc 1.98.1) warns that "the same inputs may produce different results even
# within a single program run", so no crate of the workspace calls them, generator or not.
disallowed-methods = [
    { path = "f64::sin", reason = "use hyperion_sim::math::sin (hyperion_base::math::sin): platform maths is not reproducible" },
    { path = "f64::cos", reason = "use hyperion_sim::math::cos (hyperion_base::math::cos): platform maths is not reproducible" },
    { path = "f64::tan", reason = "use hyperion_sim::math::tan (hyperion_base::math::tan): platform maths is not reproducible" },
    { path = "f64::sin_cos", reason = "use hyperion_sim::math::sin_cos (hyperion_base::math::sin_cos): platform maths is not reproducible" },
    { path = "f64::asin", reason = "use hyperion_sim::math::asin (hyperion_base::math::asin): platform maths is not reproducible" },
    { path = "f64::acos", reason = "use hyperion_sim::math::acos (hyperion_base::math::acos): platform maths is not reproducible" },
    { path = "f64::atan", reason = "use hyperion_sim::math::atan (hyperion_base::math::atan): platform maths is not reproducible" },
    { path = "f64::atan2", reason = "use hyperion_sim::math::atan2 (hyperion_base::math::atan2): platform maths is not reproducible" },
    { path = "f64::sinh", reason = "use hyperion_sim::math::sinh (hyperion_base::math::sinh): platform maths is not reproducible" },
    { path = "f64::cosh", reason = "use hyperion_sim::math::cosh (hyperion_base::math::cosh): platform maths is not reproducible" },
    { path = "f64::tanh", reason = "use hyperion_sim::math::tanh (hyperion_base::math::tanh): platform maths is not reproducible" },
    { path = "f64::asinh", reason = "use hyperion_sim::math::asinh (hyperion_base::math::asinh): platform maths is not reproducible" },
    { path = "f64::acosh", reason = "use hyperion_sim::math::acosh (hyperion_base::math::acosh): platform maths is not reproducible" },
    { path = "f64::atanh", reason = "use hyperion_sim::math::atanh (hyperion_base::math::atanh): platform maths is not reproducible" },
    { path = "f64::exp", reason = "use hyperion_sim::math::exp (hyperion_base::math::exp): platform maths is not reproducible" },
    { path = "f64::exp2", reason = "use hyperion_sim::math::exp2 (hyperion_base::math::exp2): platform maths is not reproducible" },
    { path = "f64::exp_m1", reason = "use hyperion_sim::math::exp_m1 (hyperion_base::math::exp_m1): platform maths is not reproducible" },
    { path = "f64::ln", reason = "use hyperion_sim::math::ln (hyperion_base::math::ln): platform maths is not reproducible" },
    { path = "f64::log", reason = "use hyperion_sim::math::ln (hyperion_base::math::ln) and divide: platform maths is not reproducible" },
    { path = "f64::log2", reason = "use hyperion_sim::math::log2 (hyperion_base::math::log2): platform maths is not reproducible" },
    { path = "f64::log10", reason = "use hyperion_sim::math::log10 (hyperion_base::math::log10): platform maths is not reproducible" },
    { path = "f64::ln_1p", reason = "use hyperion_sim::math::ln_1p (hyperion_base::math::ln_1p): platform maths is not reproducible" },
    { path = "f64::powf", reason = "use hyperion_sim::math::powf (hyperion_base::math::powf): platform maths is not reproducible" },
    { path = "f64::powi", reason = "use hyperion_sim::math::powi (hyperion_base::math::powi): platform powi has unspecified precision" },
    { path = "f64::cbrt", reason = "use hyperion_sim::math::cbrt (hyperion_base::math::cbrt): platform maths is not reproducible" },
