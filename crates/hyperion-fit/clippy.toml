    { path = "f32::tanh", reason = "use f64 and hyperion_sim::math::tanh (hyperion_base::math::tanh): platform maths is not reproducible" },
    { path = "f32::asinh", reason = "use f64 and hyperion_sim::math::asinh (hyperion_base::math::asinh): platform maths is not reproducible" },
    { path = "f32::acosh", reason = "use f64 and hyperion_sim::math::acosh (hyperion_base::math::acosh): platform maths is not reproducible" },
