    { path = "f64::mul_add", reason = "use hyperion_sim::math::mul_add (hyperion_base::math::mul_add): without hardware FMA this calls the platform's fma" },
    { path = "f64::to_bits", reason = "float bits are never hashed; print bits through the testkit only" },
    { path = "f64::to_le_bytes", reason = "float bits are never hashed; print bits through the testkit only" },
