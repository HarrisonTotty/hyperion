# The displaced form table's fit (plan 15, P15.T6.c–f) on the 1% orbit run: `displaced_forms.toml`'s
# settings on dataset `displaced_one_percent`, run with `--manifest` and `--out` to judge the
# fits on real statistics before the production histograms land. Never committed as the table.
task = "displaced_forms"
datasets = ["displaced_one_percent"]

[params]
histograms = "one_percent"
orbit_manifest = "displaced_orbits.one_percent.toml"
# Gauss–Legendre nodes per cell and axis of the histograms' cells.
cell_nodes = 3
# Nelder–Mead: evaluations of a class's first fit (and of every old fit), of a regularised refit,
# and the simplex's tolerance in misplaced share.
evaluations = 3_000
refit_evaluations = 600
tolerance = 1e-7
# P15.T6.c: a spheroid under 5% of the weight is dropped; the age bins of a speed row are tied by
# the largest penalty of the ladder that raises the weighted mean misplaced share by 0.3 points at
# most, in Gauss–Seidel sweeps along the row.
drop_weight = 0.05
lambdas = [1e-4, 1e-3, 1e-2, 1e-1]
rise_limit = 0.003
sweeps = 2
# The neutron stars' band-averaged speed-bin shares at the fixture (P08.T8.b as built under ruling
# 123), which weight the classes' misplaced shares and heights.
speed_weights = [0.188, 0.059, 0.155, 0.193, 0.147, 0.105, 0.072, 0.081]
# P15.T6.f: the Galaxy's Type Ia rate, 0.54 per century (Li et al. 2011, MNRAS 412, 1473), the
# surviving-donor channel's 30% and its 1,900–2,500 km/s (Shen et al. 2018, ApJ 865, 15).
ia_rate_per_year = 0.0054
hypervelocity_channel_share = 0.3
hypervelocity_speed_km_s = 2_200.0
hypervelocity_panel_nodes = 8
hypervelocity_directions = 256
