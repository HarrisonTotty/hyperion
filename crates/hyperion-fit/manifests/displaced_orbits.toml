# The displaced form table's production orbit run (plan 15, P15.T6.b; ruling 120.3): plan 15's
# 1.2 × 10⁷ disc-born orbits (56 classes of 214,286), 1.6 × 10⁶ for each old population but the
# nuclear disc (eight classes of 200,000), 10⁵ a class for the nuclear disc, and 20,000 orbits for
# each barred source's unkicked control, at the Milky Way fixture. Days of computing: run it niced
# with `hyperion-fit orbits --threads 3`, in resumable parts (ruling 120.4), never in CI.
task = "displaced_forms"

[params]
seed = 0x0615_6b00_0000_0000
galaxy_seed = 0x0615_6b00_0000_0001
disc_orbits_per_class = 214_286
old_orbits_per_class = 200_000
nuclear_orbits_per_class = 100_000
control_orbits = 20_000
# 1 ÷ 200 of the local circular period, P15.T6.g's time-transformed leapfrog, with no step floor.
step_fraction = 0.005
# The nuclear disc keeps 1 ÷ 200 (ruling 120.3, measured with T6.a's fixed step): at 1 ÷ 100 a
# reduced run of 1,200 nuclear orbits refined 22.3% of them against 15.2% (47% more; ruling 120.3
# allows 10%) and kept twice as many over the drift tolerance (2.0% against 1.1%).
nuclear_step_fraction = 0.005
# An orbit whose Jacobi integral drifts by more than 10⁻³ of max(|J₀|, |Φ(x₀)|) is integrated
# again at half the step fraction, up to three times (ruling 120.3; the scale is
# decision-p15-t6g-orbits §2's): the histograms need positions, and 10⁻³ bounds δ ln r by
# 0.003–0.03 (|Φ₀| ÷ v_c² from 3 at the Sun to 30 at 100 ly) against cells 0.20 wide. One still over it is unresolved, counted and not classified, and
# the fit refuses a class with more than one in 10⁴ (P15.T6.g).
drift_tolerance = 1e-3
max_halvings = 3
# Dehnen's (2000) quadrupole at a twentieth of v_c² at the bar's half-length.
bar_strength = 0.05
# The fixture's own corotation ratio.
corotation_ratio = 0.0
chunk = 256
# Parts of 4,096 orbits: 4,703 files of 10–40 kB, the longest (the nuclear disc's) about 35
# minutes on three threads, each written whole when done, so a stopped run loses at most one part.
part_orbits = 4_096
