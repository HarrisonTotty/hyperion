# What pair evolution changes in layer E's luminosity tables (rendering plan R06, R06.T5.d; decided
# 2026-10-03, decision-r06-tables.md): per cell of [Fe/H] node and log-age bin, the mean per born
# system of the pair-evolved less single-evolved light, colour and count in 1-mag M_V bins, from
# 20,000 systems a cell. The parameters besides systems_per_cell are constants of the code
# (`hyperion_sim::sky::binary_light`, the luminosity tables' bin edges in `sky::luminosity`, and the
# task's chunk, which orders each cell's sums), recorded here so that the inputs hash covers them;
# the task refuses a manifest that disagrees with the code.
task = "sky_binary_light_e"

[params]
# 2 × 10⁴ in every cell, and more in a cell that carries a component bin's error past the gate
# ("T5.d gate reading"), a cell being its [Fe/H] node × 26 + age bin. From generator version 26
# cell 25 ([Fe/H] −2, the last age bin) carried 64% of the halo's [Fe/H] −1.5 bin's 1σ, 2.77% of
# its light at 2 × 10⁴ systems.
systems_per_cell = 20_000
raised_cells = [[25, 100_000]]
fe_h_nodes = [-2.0, -1.0, -0.5, 0.0, 0.18]
first_age_log10 = 5.0
age_step_dex = 0.2
age_bins = 26
last_age_years = 1.5e10
magnitude_bins = 32
brightest_magnitude = -12.0
magnitude_step = 0.05
chunk = 250
galaxy_seed = 0x5b1a_0005_0000_5eed
