# The X-ray binaries' sampler and share row (plan 15, P15.T10.b; read by plan 11's P11.T8.b class
# from generator version 27, refitted for 29, 30 and 32), fitted against plan 11's engine at generator
# version 34's rules, whose census is 31's, through the sim's own census
# (`stellar::binary::testing::class_census_in`) of the pairs the generator draws at each record's
# first attempt (train 27's finding), as `binary_awd.toml`'s are: the same slab of 10^7 records of
# layers C–E about the solar circle and the same sites ([x, y, z, half-widths] in ly), the young thin
# disc's census of 3 × 10^6 records, since its high-mass hosts are a few in a hundred of its layer-E
# records. The fit takes parts 0–31 of 64 of every census's cells, and the sim's slow tests the
# rest. The row is scaled to the brainstorm's 10^4 hosts (Corral-Santana et al. 2016, A&A 587,
# A61), and from 32 each side of the class is pinned to its own count (P11.T8.b's fix; plan 11's
# design note 11): the black-hole transients at 0.13 of the row
# (`tables::binary::BLACK_HOLE_TRANSIENT_SHARE`); the high-mass kinds together at 3,000, about the
# log-centre (10^3.5) of the Galaxy's intrinsic 10^3-10^4 Be/X-ray binaries (Rappaport and van den
# Heuvel 1982, IAU Symp. 98, 327; recalled), quiescent ones included (research-leans-51), of them
# the supergiant hosts 40 and the black-hole high-mass hosts 2, about the catalogued systems (Liu et
# al. 2006, A&A 455, 1165, about 36 supergiant ones; Cyg X-1 and a second allowed; recalled), and
# the Be/X hosts the rest; and the other low-mass kinds the rest of the row. Each kind's members are
# weighted alike.
task = "binary_xrb"

[params]
seed = 0x0b17_15a0_0000_0001
generator_version = 34
records = 10_000_000
population_records = 300_000
young_thin_disc_records = 3_000_000
parts = 32
part_count = 64
young_thin_disc_site = [0, 0, 0, 40_000, 40_000, 600]
bulge_site = [0, 0, 0, 5_000, 5_000, 2_000]
long_bar_site = [0, 0, 0, 16_000, 4_000, 1_000]
nuclear_disc_site = [0, 0, 0, 800, 800, 200]
halo_site = [0, 0, 10_000, 10_000, 10_000, 5_000]
total_hosts = 1.0e4
min_members = 50
high_mass_hosts = 3000.0
supergiant_hosts = 40.0
black_hole_high_mass_hosts = 2.0
