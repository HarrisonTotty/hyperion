# The X-ray binaries' sampler and share row (plan 15, P15.T10.b; read by plan 11's P11.T8.b class
# from generator version 27, refitted for 29), fitted against plan 11's engine at generator version
# 29's rules through the sim's own census (`stellar::binary::testing::class_census_in`) of the pairs
# the generator draws at each record's first attempt (train 27's finding), as `binary_awd.toml`'s
# are: the same slab of 10^7 records of layers C–E about the solar circle and the same sites ([x, y,
# z, half-widths] in ly), the young thin disc's census of 3 × 10^6 records, since its high-mass
# hosts are a few in a hundred of its layer-E records. The fit takes parts 0–31 of 64 of every
# census's cells, and the sim's slow tests the rest. The row is scaled to the brainstorm's 10^4
# hosts (Corral-Santana et al. 2016, A&A 587, A61), its black-hole transients pinned at 0.13 of them
# (`tables::binary::BLACK_HOLE_TRANSIENT_SHARE`) and each kind's members weighted alike.
task = "binary_xrb"

[params]
seed = 0x0b17_15a0_0000_0001
generator_version = 29
records = 10_000_000
population_records = 300_000
young_thin_disc_records = 3_000_000
parts = 32
part_count = 64
young_thin_disc_site = [0, 0, 0, 40_000, 40_000, 600]
bulge_site = [0, 0, 0, 5_000, 5_000, 2_000]
long_bar_site = [0, 0, 0, 16_000, 4_000, 1_000]
nuclear_disc_site = [0, 0, 0, 800, 800, 200]
halo_site = [0, 0, 10_000, 10_000, 10_000, 5_000]
total_hosts = 1.0e4
min_members = 50
