# The X-ray binaries' sampler from generator version 32 (P11.T8.b's fix of the high-mass side;
# plan 15, P15.T10.b), fitted as `binary_xrb.toml`'s, on the same censuses, its galaxy at 32's
# rules, and with each side of the class pinned to its own observed count (plan 11's design note
# 11): the high-mass kinds together 152 of the row's 10^4 hosts, Fortin et al.'s (2023, A&A 671,
# A149; recalled) catalogue of the Galaxy's high-mass X-ray binaries, the black-hole transients
# 0.13 of them (`tables::binary::BLACK_HOLE_TRANSIENT_SHARE`) and the other low-mass kinds the
# rest. `binary_xrb.toml` gives the high-mass kinds the engine's share of the whole class, some
# eight hosts. The row is `binary_xrb`'s; the 32 bump moves `high_mass_hosts` into its manifest
# and deletes this one.
task = "binary_xrb_32"

[params]
seed = 0x0b17_15a0_0000_0001
generator_version = 32
records = 10_000_000
population_records = 300_000
young_thin_disc_records = 3_000_000
parts = 32
part_count = 64
young_thin_disc_site = [0, 0, 0, 40_000, 40_000, 600]
bulge_site = [0, 0, 0, 5_000, 5_000, 2_000]
long_bar_site = [0, 0, 0, 16_000, 4_000, 1_000]
nuclear_disc_site = [0, 0, 0, 800, 800, 200]
halo_site = [0, 0, 10_000, 10_000, 10_000, 5_000]
total_hosts = 1.0e4
high_mass_hosts = 152.0
min_members = 50
