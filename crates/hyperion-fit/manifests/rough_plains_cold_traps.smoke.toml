# The rough plains' cold traps' smoke run, for the crate's tests: two 32² surfaces at three slopes,
# 36 azimuths, a 5 × 7 grid of colatitudes and limbs with cold shares at 4 × 4 of them, and six
# irradiance nodes, in about a second.
task = "rough_plains_cold_traps"

[params]
seed = 0x0907_0700
surfaces = 2
grid = 32
wavenumber_low = 2.0
wavenumber_high = 8.0
hurst = 0.9
azimuths = 36
view_stride = 2
sun_stride = 3
step = 1.0
reach = 32.0
star_radius_deg = 0.2711
slopes = [0.05, 0.3, 1.0]
colatitude_range = 4.0
colatitude_nodes = 5
limb_range = 2.0
limb_nodes = 7
cold_colatitude_indices = [0, 1, 2, 4]
cold_limb_indices = [0, 1, 3, 6]
irradiance_min = 1e-3
irradiance_max = 10.0
irradiance_nodes = 5
instant_range = 2.0
instant_nodes = 5
samples = 64
digits = 4
chunk = 4
