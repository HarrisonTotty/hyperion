# Rough plains' permanent shadow and its cold shares by ray tracing Gaussian surfaces (rendering
# plan R09, R09.T7.g; science-r09-drainage.md §8.13): the table `cold_trap::rough_plains` reads.
# Eight periodic surfaces of 512² pixels, Hurst exponent 0.9 from 2 to 32 cycles across (16 pixels
# to the shortest wave, where the bands stop moving with the grid); horizons at 180 azimuths (2°),
# the irradiance's views and the star's path at every other (4°), rays of 1-pixel steps to 256.
# Axes: seven slopes w = tan σ_s from 0.05 to 1; e₀ ÷ w at 33 nodes on [0, 4] and D ÷ w at 33 on
# [0, 1.6] for the shadow, every second and every fourth for the cold shares; the irradiance at 0
# and 16 fractions of S sin e from 10⁻⁴ to 10. About an hour on 4 vCPU.
task = "rough_plains_cold_traps"

[params]
seed = 0x0907_0700
surfaces = 8
grid = 512
wavenumber_low = 2.0
wavenumber_high = 32.0
hurst = 0.9
azimuths = 180
view_stride = 2
sun_stride = 2
step = 1.0
reach = 256.0
slopes = [0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 1.0]
colatitude_range = 4.0
colatitude_nodes = 33
limb_range = 1.6
limb_nodes = 33
cold_colatitude_stride = 2
cold_limb_stride = 4
irradiance_min = 1e-4
irradiance_max = 10.0
irradiance_nodes = 16
instant_range = 2.0
instant_nodes = 41
samples = 4096
digits = 4
chunk = 8
