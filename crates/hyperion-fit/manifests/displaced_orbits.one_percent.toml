# The displaced form table's 1% orbit run (plan 15, P15.T6.b): the production manifest,
# `displaced_orbits.toml`, with every count divided by 100 (2,143 orbits per thin-disc class, 2,000
# per old class, 1,000 per nuclear-disc class, 200 per control). About an hour on three threads,
# niced: a check of the fits on real statistics before the production histograms land, never in CI.
task = "displaced_forms"

[params]
seed = 0x0615_6b00_0000_0000
galaxy_seed = 0x0615_6b00_0000_0001
disc_orbits_per_class = 2_143
old_orbits_per_class = 2_000
nuclear_orbits_per_class = 1_000
control_orbits = 200
# 1 ÷ 200 of the circular period at the pericentre, never below 1,000 years.
step_fraction = 0.005
# The nuclear disc keeps 1 ÷ 200 (ruling 120.3): at 1 ÷ 100 a reduced run of 1,200 nuclear orbits
# refined 22.3% of them against 15.2% (47% more; ruling 120.3 allows 10%) and kept twice as many
# over the drift tolerance (2.0% against 1.1%).
nuclear_step_fraction = 0.005
min_step_years = 1_000.0
# An orbit whose Jacobi integral drifts by more than 10⁻³ is integrated again at half the step, up
# to three times: T6.a's 10⁻⁴ with six halvings, which the test orbits meet, would quadruple the
# run (the barred inner orbits refine most); the histograms need positions, not energies to 10⁻⁴.
drift_tolerance = 1e-3
max_halvings = 3
# Dehnen's (2000) quadrupole at a twentieth of v_c² at the bar's half-length.
bar_strength = 0.05
# The fixture's own corotation ratio.
corotation_ratio = 0.0
chunk = 256
# Parts of 4,096 orbits: 4,703 files of 10–40 kB, the longest (the nuclear disc's) about 35
# minutes on three threads, each written whole when done, so a stopped run loses at most one part.
part_orbits = 4_096
