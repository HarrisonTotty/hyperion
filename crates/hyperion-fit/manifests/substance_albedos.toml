# The condensed optics of the substance registry's solids (plan 14, P14.T49.c): each row's normal
# albedo in B, V and R at its reference grain class by Hapke's model, and its energy albedos by the
# similarity relation. The reference forms' photometry and grain sizes are the sim's
# (`hyperion_sim::substance::optics`), which the task's fingerprint probes; the indices are
# rendering plan R08's committed material files, listed here in the optics rows' registry order,
# whose data hashes the inputs hash covers (`hyperion_fit::materials`). The task takes no
# parameters and no dataset.
task = "substance_albedos"
materials = [
