# Aerosol extinction at 550 nm (plan 14, P14.T49.e), the third of seven tables:
# rendering plan R08's committed index files of the aerosol materials, seven to a table in name
# order, each read where it lies and its data hash in the inputs hash (`hyperion_fit::materials`).
# Each file's spheres at its index at 550 nm, found by wavelength on its own grid, averaged over
# Hansen and Travis 1974's gamma distribution and the log-normal. The grid, the fine radius grid
# and the half-step check are constants of `src/tasks/condensate_extinction.rs`; the task takes
# no parameters and no dataset.
task = "condensate_extinction_3"
materials = [
    "enstatite-glass.json",
    "ethane-liquid.json",
    "forsterite-amorphous.json",
    "graphite.json",
    "hydrogen-sulphide-ice.json",
    "hydrogen-sulphide-liquid.json",
    "ice-giant-haze.json",
]
