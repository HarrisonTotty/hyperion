# The scale of Chabrier's high-mass branch (plan 15, P15.T4.b; ruling 138): the multinomial
# maximum-likelihood fit to the 20 pc census's primary counts in bands A–D (our tally of
# Kirkpatrick et al. 2024, table 4), the model's shares renormalised over 0.08–8 M☉. The counts are
# the task's constants, recorded here so that the inputs hash covers them; the task refuses a
# manifest that disagrees.
task = "chabrier"

[params]
count_a = 1491
count_b = 288
count_c = 400
count_d = 64
