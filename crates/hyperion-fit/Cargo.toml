[package]
name = "hyperion-fit"
description = "Offline fitting for HYPERION: emits the constant tables the generator reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Nothing depends on this crate, so it is not in `[workspace.dependencies]`. It depends on the sim
# for `hyperion_sim::math`, the quadratures and the generator's own code, so that a fit is
# bit-identical on every platform. The ordinary crates below are allowed here and only here (plan
# 15, Design note 3): none of them computes a table's numbers, and `rayon` is used only inside
# `parallel::map_reduce_chunks`, whose reduction is in index order. `serde_json` reads and writes
# the atmosphere reference's cases and references, the client's JSON fixtures (plan R08,
# R08.T12.a); it computes nothing either. The sim's `testing` feature gives the fits plan 09's
# copy of the Baumgardt–Hilker catalogue (plan 15's Consumes).
[dependencies]
clap.workspace = true
hyperion-sim = { workspace = true, features = ["testing"] }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
