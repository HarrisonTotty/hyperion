# Phase I methane ice's absorption at 40 K of Grundy, Schmitt and Quirico (2002): the frost `CH4`'s
# imaginary index beyond 780 nm (plan 14, P14.T49.i). Reduced by `reduce.py` from the authors'
# reduced-resolution table (git-ignored, `data/cache/grundy_2002_ch4/alpha_CH4.ascii`) to its 40 K
# column from 0.77998 µm, and committed as measured values with the citation. Reproduced from the raw
# by hand on 2026-10-16: `python3 -I crates/hyperion-fit/data/grundy_2002_ch4/reduce.py <raw>
# crates/hyperion-fit/data/grundy_2002_ch4/alpha_40k.csv`, from outside the raw's directory. Read
# by `run substance_albedos`.
