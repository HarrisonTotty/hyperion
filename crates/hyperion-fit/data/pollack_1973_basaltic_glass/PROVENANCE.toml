# A terrestrial basaltic glass's optical constants of Pollack, Toon and Khare (1973), as the Aerosol
# Refractive Index Archive distributes them: the regolith's infrared index beyond 780 nm (plan 14,
# P14.T49.i), the file rendering plan R08's basaltic-glass.json was reduced from. The paper gives n at a few
# wavelengths and k at many, so n is read from the rows that give n and k from the rows that give k.
# Reduced by `reduce.py` from the archive's file (git-ignored, `data/cache/pollack_1973_basaltic_glass/basaltic_glass_R_Pollack_1973.ri`) to its rows
# over 0.5-5 µm, and committed as measured values with the citation. Reproduced from the raw by hand
# on 2026-10-16: `python3 -I crates/hyperion-fit/data/pollack_1973_basaltic_glass/reduce.py <raw>
# crates/hyperion-fit/data/pollack_1973_basaltic_glass/nk.csv`, from outside the raw's directory. Read by
# `run substance_albedos`.
