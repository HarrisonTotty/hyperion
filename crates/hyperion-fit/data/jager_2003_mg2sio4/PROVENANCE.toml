# Amorphous Mg2SiO4's optical constants of Jäger et al. (2003), as HITRAN2024's aerosol compilation
# distributes them: the regolith `Mg2SiO4`'s infrared index beyond 780 nm (plan 14, P14.T49.i), the
# file rendering plan R08's forsterite-amorphous.json was reduced from. The file prints k to four
# decimals, so below 1.5 µm, where k is 1-2 × 10⁻⁴, it is coarse. Reduced by `reduce.py` from the
# compilation's ASCII file (git-ignored, `data/cache/jager_2003_mg2sio4/jager_mg2sio4.dat`) to its
# rows over 0.7794-5.019 µm, and committed as measured values with the citations. Reproduced from
# the raw by hand on 2026-10-16: `python3 -I crates/hyperion-fit/data/jager_2003_mg2sio4/reduce.py
# <raw> crates/hyperion-fit/data/jager_2003_mg2sio4/nk.csv`, from outside the raw's directory. Read
# by `run substance_albedos`.
