# Selected rows of the IPRT polarized radiative transfer model intercomparison, Phase A (the
# model PSTAR's results for cases A1, A2 and A4, and for A3 and A5 since R08.T12.e), case A4's
# spheroid phase matrix and A3's and A5's sphere matrices (the last two only to check the client's
# Mie against, R08.T12.e), reformatted, committed under the wiki's licence, CC BY-SA 3.0, with
# attribution (README.md). The values the tracer's benchmarks assert (rendering plan R08,
# R08.T12.c and R08.T12.e, and A5's from R08.T12.f; `decision-r08-licences.md` row 6d). Read by
# `atmosphere::benchmarks`; tests only, never shipped.
dataset = "iprt_phase_a"
class = "committed"
citation = "C. Emde, V. Barlakas, C. Cornet, F. Evans, S. Korkin, Y. Ota, L. C.-Labonnote, A. Lyapustin, A. Macke, B. Mayer and M. Wendisch, IPRT polarized radiative transfer model intercomparison project - Phase A, J. Quant. Spectrosc. Radiat. Transfer 164 (2015) 8-36, DOI 10.1016/j.jqsrt.2015.05.007; results from the IPRT wiki"
url = "https://www.libradtran.org/iprt/doku.php?id=intercomparisons:intercomparisons"
retrieved = "2026-10-10"
release = "iprt_case_a1_pstar.dat, iprt_case_a2_pstar.dat, iprt_case_a4_pstar.dat and sizedistr_spheroid.dat as served on 2026-10-09, and iprt_case_a3_pstar.dat, iprt_case_a5-pr_pstar.dat, iprt_case_a5-al_pstar.dat, waso.mie.dat and watercloud.mie.dat as served on 2026-10-10 (their SHA-256s in README.md)"
