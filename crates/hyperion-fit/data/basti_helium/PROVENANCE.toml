# BaSTI's alpha-enhanced helium-enhanced stellar models (plan 15, P15.T7.a; Design note 12), the
# source of `tables::helium`. A fetched dataset: the 88 files come to 38.4 MB, and the site states
# no licence (it asks only that use of its web tools be acknowledged), so only this file, the
# reduction script and its reduced output are committed. The raw files are downloaded into
# `crates/hyperion-fit/data/cache/basti_helium/` (git-ignored), keeping the site's paths below
# `basti-old/BASTI/`. Tracks and HB files are the theoretical-plane "c04ae" sets (UBVRIJKL colours,
# Castelli 2004 transformations); only log age, mass, log L and log Teff are read.
dataset = "basti_helium"
class = "fetched"
citation = "Pietrinferni, Cassisi, Salaris and Castelli (2006), ApJ 642, 797: the BaSTI alpha-enhanced canonical models (eta = 0.2), with the database's helium-enhanced alpha-enhanced extension (Y = 0.30, 0.35, 0.40; files computed 2009, some renormalised 2011 and 2014); the helium-enhanced readme names no paper of its own beyond Pietrinferni et al. (2004, ApJ 612, 168; 2006) and Cassisi et al. (2004, ApJ 616, 498)"
url = "http://basti-iac.oa-abruzzo.inaf.it/basti-old/BASTI/DATA_AE_S/HE_EN/aes_hems_c.php"
retrieved = "2026-09-30"
release = "BaSTI Ver. 5.0.1 (the previous release, kept at basti-old/ beside BaSTI-IAC): canonical alpha-enhanced Z = 0.0001, 0.0003, 0.001, 0.002, 0.004, 0.008, 0.0198 (tracks eta = 0.2, HB, ZAHB, summary tables) and helium-enhanced Y = 0.30, 0.35, 0.40 at the same [M/H] (Y = 0.35, 0.40 only at Z = 0.0198), as the site served them on that date"
licence = "none stated; the site's acknowledgement page asks: \"We would appreciate if, whenever one of the BaSTI web tools is employed in comparisons with models and data, the following sentence is included in the acknowledgements: 'This work has made use of BaSTI web tools.'\""

