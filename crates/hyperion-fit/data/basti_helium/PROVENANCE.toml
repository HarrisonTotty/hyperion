# BaSTI's alpha-enhanced helium-enhanced stellar models (plan 15, P15.T7.a; Design note 12), the
# source of `tables::helium`, reduced by P15.T7.b. A committed dataset of reduced facts: the site
# states no licence (it asks only that use of its web tools be acknowledged), so only the numbers
# the fit reads are committed, with the citation, as `cmc`'s are. Committed beside this file:
# `urls.txt`, the 88 raw files' URLs; `raw.sha256`, their names below `basti-old/BASTI/` and
# SHA-256s, one `<name> <sha256>` line each; `reduce.py`, which checks each raw file against that
# list and writes the output; and the output, `turnoff.csv` (the 0.6-0.9 Msun tracks' ages at the
# end of the main sequence) and `zahb.csv` (the zero-age horizontal branches by envelope mass, with
# their core masses), the files listed below. The raw files (38.4 MB) go to the git-ignored
# `crates/hyperion-fit/data/cache/basti_helium/`, keeping the site's paths; `reduce.py` reads only
# log age, mass, log L and log Teff, and the canonical summary tables' core mass at the RGB tip.
# The site's previous-release archive answered 404 for every one of the 88 URLs on 2026-10-23, so
# the raw files P15.T7.b reduced are T7.a's copies, all 88 verified against `raw.sha256`.
dataset = "basti_helium"
class = "committed"
citation = "Pietrinferni, Cassisi, Salaris and Castelli (2006), ApJ 642, 797: the BaSTI alpha-enhanced canonical models (eta = 0.2), with the database's helium-enhanced alpha-enhanced extension (Y = 0.30, 0.35, 0.40; files computed 2009, some renormalised 2011 and 2014); the helium-enhanced readme names no paper of its own beyond Pietrinferni et al. (2004, ApJ 612, 168; 2006) and Cassisi et al. (2004, ApJ 616, 498)"
url = "http://basti-iac.oa-abruzzo.inaf.it/basti-old/BASTI/DATA_AE_S/HE_EN/aes_hems_c.php"
retrieved = "2026-09-30"
release = "BaSTI Ver. 5.0.1 (the previous release, kept at basti-old/ beside BaSTI-IAC): canonical alpha-enhanced Z = 0.0001, 0.0003, 0.001, 0.002, 0.004, 0.008, 0.0198 (tracks eta = 0.2, HB, ZAHB, summary tables) and helium-enhanced Y = 0.30, 0.35, 0.40 at the same [M/H] (Y = 0.35, 0.40 only at Z = 0.0198), as the site served them on that date; reduced by reduce.py (P15.T7.b) from the 88 raw files that raw.sha256 lists with their SHA-256s, the list itself of SHA-256 367c515f809da2525dc6ccc63b623b094bb93bfeb1951a1f189fb1ec563b7644 (the recorded hash of its 88 lines, the fetched provenance's)"
licence = "none stated; the site's acknowledgement page asks: \"We would appreciate if, whenever one of the BaSTI web tools is employed in comparisons with models and data, the following sentence is included in the acknowledgements: 'This work has made use of BaSTI web tools.'\""

