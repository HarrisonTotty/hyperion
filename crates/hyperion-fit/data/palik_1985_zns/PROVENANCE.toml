# Cubic ZnS's optical constants of Palik and Addamiano (1985), as Kitzmann and Heng (2018) compile
# them in LX-MIE's compilation, the only machine-readable copy found: the regolith `ZnS`'s infrared
# index beyond 780 nm (plan 14, P14.T49.i), the file rendering plan R08's zinc-sulphide.json was
# reduced from. Its near-infrared k, 3.05-3.4 × 10⁻⁶ and smooth to seven digits from 0.99 µm, looks
# like the compiler's fill more than tabulated values, which Palik's closed handbook would settle.
# Reduced by `reduce.py` from the compilation's file (git-ignored, `data/cache/palik_1985_zns/ZnS.dat`)
# to its rows over 0.7749-6.199 µm, a reduced subset of one material, and committed with two
# citations, the primary and the compiler; no compilation file is committed whole (decision-composition
# §5). Reproduced from the raw by hand on 2026-10-16: `python3 -I
# crates/hyperion-fit/data/palik_1985_zns/reduce.py <raw> crates/hyperion-fit/data/palik_1985_zns/nk.csv`,
# from outside the raw's directory. Read by `run substance_albedos`.
