# Forty spectra and two wavelength files of the USGS Spectral Library Version 7, splib07a (Kokaly et
# al. 2017), committed unmodified (CRLF line ends, as the release writes them) from the release's
# ASCII data: the laboratory end-members of the condensed optics' rows without an index file (plan
# 14, P14.T49.i; decision-p14-t49i-rock-mixtures). Read by `run substance_albedos`.
#
# How they are used, as USGS asks that modifications be described: no file is modified. Each
# spectrum's reflectance is inverted channel by channel for a single-scattering albedo by Hapke's
# model at the spectrum's own geometry (a Beckman spectrum as a directional-hemispherical albedo, an
# ASD spectrum as a reflectance factor at incidence 20 degrees and emission 30 degrees), its deleted
# channels (-1.23e34) dropped; the albedo is then taken to a regolith's 70 µm grains through Hapke's
# equivalent slab at the mineral's stated real index, or held as measured for an opaque or unsized
# sample; a rock's albedo is a cross-section-weighted mixture of its minerals' at a cited mode; and
# the results are averaged into spectral bins over 0.3-5 µm, beyond each spectrum's reach held at
# its nearest covered bin. USGS has not reviewed or endorsed these derived values.
dataset = "usgs_splib07a"
class = "committed"
citation = "R. F. Kokaly, R. N. Clark, G. A. Swayze, K. E. Livo, T. M. Hoefen, N. C. Pearson, R. A. Wise, W. M. Benzel, H. A. Lowers, R. L. Driscoll and A. J. Klein (2017), USGS Spectral Library Version 7, U.S. Geological Survey Data Series 1035, 61 p., DOI 10.3133/ds1035; and the same authors (2017), USGS Spectral Library Version 7 Data, U.S. Geological Survey data release, DOI 10.5066/F7RR1WDJ"
url = "https://www.sciencebase.gov/catalog/item/586e8c88e4b0f5ce109fccae"
retrieved = "2026-10-16"
release = "ASCIIdata_splib07a.zip of the data release's ASCII data item (ScienceBase 586e8c88e4b0f5ce109fccae, of the release 5807a2a2e4b0841e59e3a18d), sha256 d232645740869a82aafcad5839448c50b1dc72965ce042d1374f29b7a798a91c, its members of these names (thirty-six spectra under ChapterM_Minerals, four under ChapterA_ArtificialMaterials, and the two wavelength files at the archive's top level) extracted unmodified"
