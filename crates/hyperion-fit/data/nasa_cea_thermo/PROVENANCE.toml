# NASA Glenn's thermodynamic records, as NASA's CEA (Chemical Equilibrium with Applications) ships
# them in data/thermo.inp: the 113 records plan 14's P14.T49.d and P14.T52.a read (every
# substance-registry gas row's but FeH's, which the file lacks, with the S, N and C atoms P14.T52.a
# appends; the elements' reference states; and the MgSO4 and graphite cross-checks' species),
# extracted verbatim by `reduce.py`, with the file's header, CRLF line ends and END lines, so that
# the subset is a CEA library itself, and one `!` line ahead of the header stating the change
# (Apache 2.0, §4(b)). Under Apache 2.0, whose text is kept beside it (LICENSE.txt) and whose notice
# is in the repository's NOTICE. Read by `run thermo_equilibrium`, which re-emits the polynomials to
# `tables/thermo.rs`. `kf.py`, `cea.py` and `asserted.py` beside it are the independent Python
# evaluation that `substance::formation`'s tests assert.
dataset = "nasa_cea_thermo"
class = "committed"
citation = "B. J. McBride, M. J. Zehe and S. Gordon (2002), NASA Glenn Coefficients for Calculating Thermodynamic Properties of Individual Species, NASA/TP-2002-211556 (NASA Glenn Research Center); the records of data/thermo.inp of NASA's CEA, with the species' own sources as each record's comment names them, and C. Snyder's (NASA GRC) 2019-2021 updates"
url = "https://raw.githubusercontent.com/nasa/cea/2f79a647e85737742fb08a127da00d1ea1d069da/data/thermo.inp"
