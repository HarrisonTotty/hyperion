# TMAP (the Tuebingen NLTE Model-Atmosphere Package) H+He spectra of hot compact stars, from SVO's
# "TMAP" collection: pure hydrogen (He mass fraction 0) at 90,000 and 100,000 K, log g 6.5-9, for
# the hottest DA white dwarfs; He mass fraction 0.3 at 60,000-100,000 K, log g 5-9, for hot stars
# that are not white dwarfs. A fetched dataset (plan 15, Design note 12): no licence is stated, so
# only this file and `urls.txt` are committed. The raw files are downloaded into `crates/hyperion-
# fit/data/cache/tmap/`, which git ignores: each line of `urls.txt` is a file name and the URL it
# was downloaded from (SVO serves the ASCII form with `&format=ascii`). Read by `run star_colour`
# (rendering plan R06, R06.T3.a).
dataset = "tmap"
class = "fetched"
citation = "Werner, Deetjen, Dreizler, Nagel, Rauch and Schuh (2003), ASP Conf. Ser. 288, 31; Rauch and Deetjen (2003), ASP Conf. Ser. 288, 103: TMAP H+He model spectra"
url = "http://svo2.cab.inta-csic.es/theory/newov2/index.php?models=tmap"
retrieved = "2026-10-02"
release = "57 models of SVO collection tmap in ASCII (Angstrom, erg/cm2/s/A), as served on that date: Hemass 0 at 90,000 and 100,000 K with log g 6.5-9, Hemass 0.3 at 60,000-100,000 K with log g 5-9"
licence = "none stated by the model authors; the Spanish Virtual Observatory asks that work using its theoretical services acknowledge SVO"

