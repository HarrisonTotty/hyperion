# (plan 15, Design note 12): no licence is stated, so only this file and `urls.txt` are committed.
# The raw files are downloaded into `crates/hyperion-fit/data/cache/pickles1998/`, which git
# ignores: each line of `urls.txt` is a file name and the URL it was downloaded from. Read by `run
# star_colour` (rendering plan R06, R06.T3.a).
