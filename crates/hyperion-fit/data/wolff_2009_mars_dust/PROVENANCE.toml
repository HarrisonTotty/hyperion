# Mars's dust's optical constants of Wolff et al. (2009), as the NASA Ames Mars Climate Modeling
# Group distributed them (one header line, then rows of wavelength in µm, n and k over 0.263-98.5
# µm): the regolith `mars_dust`'s infrared index beyond 780 nm (plan 14, P14.T49.i), the table
# rendering plan R08's mars-dust.json was reduced from over 380-780 nm (decision-r08-licences, row
# 3). Reduced by `reduce.py` from the table (git-ignored,
# `data/cache/wolff_2009_mars_dust/Dust_Refractive_Indicies.txt`) to 148 of its 229 rows,
# 0.7-5.5 µm, as the table prints them: its 146 infrared rows over 0.8-4.9946 µm, and the rows at
# 0.7 and 5.5 µm that bracket the task's 0.78-5 µm. No other row, and no raw file, is committed.
# Committed as measured values with the citations. Reproduced from the raw by hand on 2026-10-16:
# `python3 -I crates/hyperion-fit/data/wolff_2009_mars_dust/reduce.py <raw>
# crates/hyperion-fit/data/wolff_2009_mars_dust/nk.csv`, from outside the raw's directory. Read by
# `run substance_albedos`.
