# Crystalline α-CO ice's optical constants at 25 K of Gerakines, Materese and Hudson (2023), from
# NASA's Optical Constants Database: the frost `CO`'s infrared index over 3.33-5 µm, its
# fundamental band (plan 14, P14.T49.i). Reduced by `reduce.py` from the database's export
# (git-ignored, `data/cache/gerakines_2023_co/all.csv`) to its rows from 1990 cm⁻¹, averaged over
# blocks of 8 rows (0.48 cm⁻¹, the measurement's 0.5 cm⁻¹ resolution), and committed as measured
# values with the citation. Reproduced from the raw by hand on 2026-10-16: `python3 -I
# crates/hyperion-fit/data/gerakines_2023_co/reduce.py <raw>
# crates/hyperion-fit/data/gerakines_2023_co/nk_25k.csv`, from outside the raw's directory. Read
# by `run substance_albedos`.
