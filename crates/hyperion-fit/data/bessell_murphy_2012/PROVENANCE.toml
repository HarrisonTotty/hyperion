# The normalised photonic UBVRI responses of Bessell and Murphy (2012), Table 1, as CDS distributes
# them (VizieR J/PASP/124/140); only the V columns are read. A fetched dataset (plan 15, Design note
# 12): no licence is stated, so only this file and `urls.txt` are committed. The raw files are
# downloaded into `crates/hyperion-fit/data/cache/bessell_murphy_2012/`, which git ignores: each
# line of `urls.txt` is a file name and the URL it was downloaded from. Read by `run star_colour`
# (rendering plan R06, R06.T3.a).
dataset = "bessell_murphy_2012"
