citation = "Bessell and Murphy (2012), PASP 124, 140: revised photonic passbands, Table 1 (VizieR J/PASP/124/140)"
url = "https://cdsarc.cds.unistra.fr/ftp/J/PASP/124/140/"
retrieved = "2026-10-02"
release = "table1.dat as CDS served it on that date (dated 2013-02-11)"
licence = "none stated; CDS asks that VizieR be acknowledged and the paper cited"

