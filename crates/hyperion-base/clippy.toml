# Clippy configuration for `hyperion-base` alone, modelled on the sim's. Clippy takes the nearest
# `clippy.toml` and does not merge, so this file shadows the workspace root's completely and has to
# repeat everything this crate needs; `crates/hyperion-testkit/tests/clippy_bans.rs` holds it to
# the shared ban list. Its float-bit bans are why it must not fall back to the root's file.

# Author names, journal abbreviations and supernova types that `doc_markdown` would otherwise
# take for code; ".." keeps Clippy's defaults.
doc-valid-idents = ["McMillan", "McConnell", "McKee", "McDonald", "McElroy", "McCray", "ApJ", "ApJS", "IIb", ".."]

# Every transcendental function goes through `hyperion_base::math`, which wraps the exactly pinned
# `libm`. The platform's own versions differ between operating systems and CPU architectures, and
# a saved universe must survive being moved to another machine. That includes `mul_add`, which
# calls the platform's `fma` where the CPU has none. Float bits are never hashed, whether as an
# integer or as bytes, and the golden writer that prints them lives in `hyperion-testkit`.
#
# The `algebraic_*` methods (`algebraic_add`, `_sub`, `_mul`, `_div` and `_rem`, on `f64` and `f32`)
# license the compiler to fuse, reassociate and otherwise rewrite float arithmetic as if it were
# real arithmetic. Rust's documentation of them ("Algebraic operators", `core`'s
# `primitive_docs.rs`, rustc 1.98.1) warns that "the same inputs may produce different results even
# within a single program run", so no crate of the workspace calls them, generator or not.
#
# WebAssembly's relaxed-SIMD intrinsics are safe functions, callable with no `unsafe` and no
# `target_feature` in sight, and leave NaN, signed-zero and rounding results to the engine
# (plan R04, Design note 10). They are banned here by path, with `allow-invalid = true` because
# the host's Clippy cannot resolve `core::arch::wasm32`; they bind under the Clippy run for
# `wasm32-unknown-unknown`, and are a second layer behind the source test in
# `crates/hyperion-testkit/tests/clippy_bans.rs` that rejects `target_feature` attributes.
disallowed-methods = [
    { path = "f64::sin", reason = "use hyperion_base::math::sin: platform maths is not reproducible" },
    { path = "f64::cos", reason = "use hyperion_base::math::cos: platform maths is not reproducible" },
    { path = "f64::tan", reason = "use hyperion_base::math::tan: platform maths is not reproducible" },
    { path = "f64::sin_cos", reason = "use hyperion_base::math::sin_cos: platform maths is not reproducible" },
    { path = "f64::asin", reason = "use hyperion_base::math::asin: platform maths is not reproducible" },
    { path = "f64::acos", reason = "use hyperion_base::math::acos: platform maths is not reproducible" },
    { path = "f64::atan", reason = "use hyperion_base::math::atan: platform maths is not reproducible" },
    { path = "f64::atan2", reason = "use hyperion_base::math::atan2: platform maths is not reproducible" },
    { path = "f64::sinh", reason = "use hyperion_base::math::sinh: platform maths is not reproducible" },
    { path = "f64::cosh", reason = "use hyperion_base::math::cosh: platform maths is not reproducible" },
    { path = "f64::tanh", reason = "use hyperion_base::math::tanh: platform maths is not reproducible" },
    { path = "f64::asinh", reason = "use hyperion_base::math::asinh: platform maths is not reproducible" },
    { path = "f64::acosh", reason = "use hyperion_base::math::acosh: platform maths is not reproducible" },
    { path = "f64::atanh", reason = "use hyperion_base::math::atanh: platform maths is not reproducible" },
    { path = "f64::exp", reason = "use hyperion_base::math::exp: platform maths is not reproducible" },
    { path = "f64::exp2", reason = "use hyperion_base::math::exp2: platform maths is not reproducible" },
    { path = "f64::exp_m1", reason = "use hyperion_base::math::exp_m1: platform maths is not reproducible" },
    { path = "f64::ln", reason = "use hyperion_base::math::ln: platform maths is not reproducible" },
    { path = "f64::log", reason = "use hyperion_base::math::ln and divide: platform maths is not reproducible" },
    { path = "f64::log2", reason = "use hyperion_base::math::log2: platform maths is not reproducible" },
    { path = "f64::log10", reason = "use hyperion_base::math::log10: platform maths is not reproducible" },
    { path = "f64::ln_1p", reason = "use hyperion_base::math::ln_1p: platform maths is not reproducible" },
    { path = "f64::powf", reason = "use hyperion_base::math::powf: platform maths is not reproducible" },
    { path = "f64::powi", reason = "use hyperion_base::math::powi: platform powi has unspecified precision" },
    { path = "f64::cbrt", reason = "use hyperion_base::math::cbrt: platform maths is not reproducible" },
    { path = "f64::hypot", reason = "use hyperion_base::math::hypot: platform maths is not reproducible" },
    { path = "f64::mul_add", reason = "use hyperion_base::math::mul_add: without hardware FMA this calls the platform's fma" },
    { path = "f64::to_bits", reason = "float bits are never hashed; print bits through the testkit only" },
