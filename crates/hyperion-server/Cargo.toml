[package]
name = "hyperion-server"
description = "HYPERION game server: hosts the simulation and serves bridge clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hyperion-protocol.workspace = true
hyperion-sim.workspace = true

anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
# `sink` for splitting a WebSocket into its reading and writing halves.
futures-util = { workspace = true, features = ["sink"] }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion.workspace = true
# The golden-file harness of plan 01, for the pinned `galaxy_parameters` response.
hyperion-testkit.workspace = true
tempfile.workspace = true
# `process` for running the binary in the command-line tests; `test-util` for the paused clock of
# the writer's timeout tests.
tokio = { workspace = true, features = ["process", "test-util", "time"] }
tokio-tungstenite.workspace = true
serde_json.workspace = true

[[bench]]
name = "density_map"
harness = false

[[bench]]
name = "range_query"
harness = false

[lints]
workspace = true
