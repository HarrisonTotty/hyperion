[package]
name = "hyperion-surface"
description = "HYPERION's shared height function, run bit for bit alike by the server and the client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# A `lib` alone: the sim and the server link it. The client's WebAssembly module is this library
# built as a `cdylib` too, which `just gen-surface` asks for on its own command line (plan R04,
# T10.b). In the manifest, the `cdylib` made cargo drop the hash from the library's file names, so
# that the native builds of the crate with and without its `testing` feature overwrote each other
# and rebuilt the sim, the server and the fitting crate in turn.
crate-type = ["lib"]
# The library has no benchmarks, and libtest's harness rejects Criterion's arguments.
bench = false

[dependencies]
# Its only dependency on every target: `math`, `rng`, `units` and the generator version. It never
# depends on the sim, which depends on it, and a new dependency is a reviewed change (plan R04,
# Risks).
hyperion-base.workspace = true

# The client module's exports (`src/wasm.rs`), on the browser target alone, so that the sim's wasip1
# and native builds, which link this crate, never compile it (plan R04, Design note 16).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen.workspace = true

[features]
# Test helpers (`testing`: the synthetic coarse fields and their builder, plan R09, T2) for other
# crates' tests; this crate's own tests see them through `cfg(test)`. The sim's `testing` feature
# enables it.
testing = []

# Golden files, test inputs and order checks, for the tests alone: a dev-dependency, so the crate's
# runtime boundary, `hyperion-base` alone, holds (plan R05, T1.a).
[dev-dependencies]
hyperion-testkit.workspace = true

# Criterion for `benches/test_planet.rs` (plan R05, T3.c), off the browser target, which has no
# use for it and on which its build is not needed.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
criterion.workspace = true

# The browser target's harness, on that target alone, never on `cfg(target_arch = "wasm32")`, which
# would build it into the wasip1 runs too (plan R04, Design note 12).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[[bench]]
name = "test_planet"
harness = false

# The synthesis's costs per point (plan R09, T6.b; T8 extends it), on the synthetic worlds of the
# `testing` feature.
[[bench]]
name = "synth"
harness = false
required-features = ["testing"]

[lints]
workspace = true
