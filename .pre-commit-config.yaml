# Git hooks for HYPERION, managed by https://pre-commit.com.
# Run `just hooks` to install, or `just pre-commit` to run against every file.
#
# Fast checks run on commit; tests run on push. `just ci-slow` remains the full gate.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
        # tsconfig files are JSONC.
        exclude: ^(.*/)?tsconfig(\..+)?\.json$
      - id: check-toml
      - id: check-yaml
        # Machine-written, and multi-document as of pnpm 12.
        exclude: ^pnpm-lock\.yaml$
      - id: end-of-file-fixer
        exclude: ^packages/protocol/src/generated/
      - id: mixed-line-ending
        args: [--fix=lf]
        # The CIE's tables are committed unmodified (CRLF), hashed by their PROVENANCE.toml.
        exclude: ^crates/hyperion-fit/data/cie_cmf/
      - id: trailing-whitespace
        exclude: ^packages/protocol/src/generated/

  # The toolchains are pinned by the repo (rust-toolchain.toml, pnpm-lock.yaml),
  # so hooks call them directly instead of using pre-commit-managed copies.
  - repo: local
    hooks:
      # Owner's rule: no Claude Code session links in commit messages or files.
      - id: no-session-links-msg
        name: no Claude session links in the commit message
        entry: '(?i)claude\.ai/code/session|^Claude-Session:'
        language: pygrep
        stages: [commit-msg]

      - id: no-session-links-files
        name: no Claude session links in files
        entry: '(?i)claude\.ai/code/session'
        language: pygrep
        types: [text]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: (\.rs|Cargo\.(toml|lock))$
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types: [text]
        exclude_types: [rust, toml]

      - id: oxlint
        name: oxlint (type-aware)
        entry: just _with-surface pnpm lint
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false

      - id: typecheck
        name: tsc
        entry: just _with-surface pnpm typecheck
        language: system
        files: (\.(ts|tsx|mts|cts)|tsconfig.*\.json|package\.json|pnpm-lock\.yaml)$
        pass_filenames: false

      - id: protocol-bindings
        name: protocol bindings are up to date
        entry: just gen-protocol-check
        language: system
        files: ^(crates/hyperion-protocol/|packages/protocol/src/generated/)
        pass_filenames: false

      # `just test`: the native suites under nextest, the doctests and vitest, built first and then
      # run under the heavy-test lock that every worktree's test runs share, so that a push does
      # not run a full suite beside another lane's and fail its timing-sensitive tests.
      - id: just-test
        name: just test (cargo nextest, doctests, vitest)
        entry: just test
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
