# Clippy configuration for every crate without one of its own: `hyperion-server`,
# `hyperion-protocol` and `hyperion-testkit`. Clippy takes the nearest `clippy.toml` walking up from
# the crate's manifest and does not merge, so `crates/hyperion-sim/clippy.toml` and
# `crates/hyperion-fit/clippy.toml` shadow this file entirely and stay self-contained.
#
# Every transcendental function goes through `hyperion_sim::math`, which wraps the exactly pinned
# `libm`. The platform's own versions differ between operating systems and CPU architectures, and a
# saved universe must survive being moved to another machine. That binds outside the sim as well:
# the server turns a map's column densities into log₁₀ before quantising them
# (`compute::density_map`), and the golden codes hold only because that logarithm is the sim's.
# That includes `mul_add`, which calls the platform's `fma` where the CPU has none.
#
# Unlike the sim's and the fitting crate's lists, this one does not ban the float-bit conversions
# (`to_bits`, `to_le_bytes` and friends). Printing float bits is the testkit's job, and the server's
# tests compare `f64` fields by their bits because the rules forbid `==` on floats; neither hashes
# them, which is what the sim's ban is for.
disallowed-methods = [
    { path = "f64::sin", reason = "use hyperion_sim::math::sin: platform maths is not reproducible" },
    { path = "f64::cos", reason = "use hyperion_sim::math::cos: platform maths is not reproducible" },
    { path = "f64::tan", reason = "use hyperion_sim::math::tan: platform maths is not reproducible" },
    { path = "f64::sin_cos", reason = "use hyperion_sim::math::sin_cos: platform maths is not reproducible" },
    { path = "f64::asin", reason = "use hyperion_sim::math::asin: platform maths is not reproducible" },
    { path = "f64::acos", reason = "use hyperion_sim::math::acos: platform maths is not reproducible" },
    { path = "f64::atan", reason = "use hyperion_sim::math::atan: platform maths is not reproducible" },
    { path = "f64::atan2", reason = "use hyperion_sim::math::atan2: platform maths is not reproducible" },
    { path = "f64::sinh", reason = "use hyperion_sim::math::sinh: platform maths is not reproducible" },
    { path = "f64::cosh", reason = "use hyperion_sim::math::cosh: platform maths is not reproducible" },
    { path = "f64::tanh", reason = "use hyperion_sim::math::tanh: platform maths is not reproducible" },
    { path = "f64::asinh", reason = "use hyperion_sim::math::asinh: platform maths is not reproducible" },
    { path = "f64::acosh", reason = "use hyperion_sim::math::acosh: platform maths is not reproducible" },
    { path = "f64::atanh", reason = "use hyperion_sim::math::atanh: platform maths is not reproducible" },
    { path = "f64::exp", reason = "use hyperion_sim::math::exp: platform maths is not reproducible" },
    { path = "f64::exp2", reason = "use hyperion_sim::math::exp2: platform maths is not reproducible" },
    { path = "f64::exp_m1", reason = "use hyperion_sim::math::exp_m1: platform maths is not reproducible" },
    { path = "f64::ln", reason = "use hyperion_sim::math::ln: platform maths is not reproducible" },
    { path = "f64::log", reason = "use hyperion_sim::math::ln and divide: platform maths is not reproducible" },
    { path = "f64::log2", reason = "use hyperion_sim::math::log2: platform maths is not reproducible" },
    { path = "f64::log10", reason = "use hyperion_sim::math::log10: platform maths is not reproducible" },
    { path = "f64::ln_1p", reason = "use hyperion_sim::math::ln_1p: platform maths is not reproducible" },
