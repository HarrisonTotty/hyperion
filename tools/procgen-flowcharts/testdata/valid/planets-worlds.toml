# Test fixture: a cut-down worlds part (bulk, atmosphere, surface, life), shaped like the real
# data (not the real data). Text sits at the schema's limits on purpose.

[meta]
stage = "planets"
part = "planets-worlds"
prefix = "pw"
title = "Worlds: Atmospheres, Surfaces & Life"
snapshot = "c3b34c96"

[[cluster]]
id = "pw.bulk"
label = "Bulk properties"

[[cluster]]
id = "pw.atmosphere"
label = "Atmosphere"

[[cluster]]
id = "pw.surface"
label = "Surface & life"

[[node]]
id = "pw.mass"
label = "Mass and iron-core mass fraction"
kind = "draw"
cluster = "pw.bulk"
summary = "Mass from the orbit's class; iron fraction from [Fe/H]"
status = "built"

[[node]]
id = "pw.mass_radius"
label = "Mass–radius relation"
kind = "table"
cluster = "pw.bulk"
summary = "Forecaster's broken power law: R ∝ M^0.28 up to 2 M⊕, M^0.59"
cite = ["Chen & Kipping 2017"]
source = ["crates/hyperion-sim/src/tables/mass_radius.rs"]
status = "built"

[[node]]
id = "pw.teq"
label = "Equilibrium temperature"
kind = "model"
cluster = "pw.bulk"
summary = "T_eq = T★ (R★ / 2a)^½ (1 − A)^¼ at the orbit's mean a"
status = "built"

[[node]]
id = "pw.escape"
label = "Atmospheric escape"
kind = "model"
cluster = "pw.atmosphere"
summary = "Jeans parameter λ and energy-limited XUV loss over age"
detail = ["λ = G M m / (k T_exo R); λ < 15 strips hydrogen"]
cite = ["Owen & Wu 2017"]
status = "partial"

[[node]]
id = "pw.keeps_air"
label = "Does it keep an atmosphere at t?"
kind = "decision"
cluster = "pw.atmosphere"
summary = "Retained column > 10⁻³ bar after the integrated loss"
status = "built"

[[node]]
id = "pw.k_tables"
label = "Correlated-k opacity tables"
kind = "table"
cluster = "pw.atmosphere"
summary = "k-distributions for H₂O, CO₂, CH₄ on a 16-point g grid"
detail = [
  "pressure 10⁻⁵–10² bar × temperature 100–3000 K",
  "random-overlap mixing of the absorbers per cell",
  "molecular line lists from ExoMol and HITRAN 2020, 1 cm⁻¹ bin",
  "Rayleigh scattering and CIA added per layer at run time",
  "16 Gauss–Legendre points in g, double-Gauss split at g=0.95",
  "tables regenerated by `just fit atmosphere` per version",
]
cite = ["Lacis & Oinas 1991", "Amundsen et al. 2017"]
source = ["crates/hyperion-fit/src/atmosphere/mod.rs", "R08.T4.f"]
status = "partial"

[[node]]
id = "pw.atmosphere"
label = "Atmosphere record"
kind = "entity"
cluster = "pw.atmosphere"
summary = "Surface pressure, composition, T(p) profile and albedo"
source = ["crates/hyperion-sim/src/planetary/derive/atmosphere.rs"]
status = "partial"

[[node]]
id = "pw.surface"
label = "Surface generator"
kind = "model"
cluster = "pw.surface"
summary = "Craters, tectonic provinces and erosion on a cube sphere"
detail = ["crater size–frequency ∝ D^−2 above 10 km, tapered"]
source = ["crates/hyperion-surface/src/lib.rs", "R09.T3"]
status = "partial"

[[node]]
id = "pw.life"
label = "Biosphere emergence"
kind = "draw"
cluster = "pw.surface"
summary = "Abiogenesis odds from liquid water, energy and time"
status = "planned"

[[node]]
id = "pw.world"
label = "World record"
kind = "entity"
summary = "Radius, density, T_eq, atmosphere, surface and biosphere"
source = ["crates/hyperion-sim/src/planetary/record.rs"]
status = "built"

[[node]]
id = "pw.world_lore"
label = "World description"
kind = "enrich"
summary = "Gemma 4 describes the world from its record's numbers"
status = "planned"

[[node]]
id = "pw.at_time"
label = "Body state at time t"
kind = "query"
summary = "Kepler propagation from the epoch, evaluated on demand"
detail = ["M = M₀ + n (t − t₀); E from Kepler's equation"]
source = ["crates/hyperion-sim/src/orbit/mod.rs"]
status = "built"

[[edge]]
from = "ps.orbit"
to = "pw.mass"
label = "mass class"

[[edge]]
from = "pw.mass"
to = "pw.mass_radius"
kind = "lookup"
label = "radius at the mass"

[[edge]]
from = "s.star"
to = "pw.teq"
label = "L★, T★, R★"

[[edge]]
from = "ps.orbit"
to = "pw.teq"
label = "semi-major axis a"

[[edge]]
from = "s.flare"
to = "pw.escape"
label = "XUV flux history"

[[edge]]
from = "pw.teq"
to = "pw.escape"

[[edge]]
from = "pw.mass_radius"
to = "pw.escape"
label = "escape velocity"

[[edge]]
from = "pw.escape"
to = "pw.keeps_air"

[[edge]]
from = "pw.keeps_air"
to = "pw.atmosphere"
label = "yes: column remaining"

[[edge]]
from = "pw.k_tables"
to = "pw.atmosphere"
kind = "lookup"
label = "opacity along the T(p) curve"

[[edge]]
from = "pw.keeps_air"
to = "pw.surface"
label = "no: airless surface"

[[edge]]
from = "pw.atmosphere"
to = "pw.surface"
kind = "constraint"
label = "erosion and weathering"

[[edge]]
from = "pw.surface"
to = "pw.life"

[[edge]]
from = "pw.atmosphere"
to = "pw.life"

[[edge]]
from = "pw.life"
to = "g.dyson"
kind = "constraint"
label = "civilisation present"

[[edge]]
from = "pw.mass_radius"
to = "pw.world"

[[edge]]
from = "pw.atmosphere"
to = "pw.world"

[[edge]]
from = "pw.surface"
to = "pw.world"

[[edge]]
from = "pw.world"
to = "pw.world_lore"

[[edge]]
from = "ps.orbit"
to = "pw.at_time"
label = "elements at the epoch"
