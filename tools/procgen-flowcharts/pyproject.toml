[project]
name = "procgen-flowcharts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
# The repo's width: rustfmt's max_width and Prettier's printWidth.
line-length = 100

[tool.mypy]
files = ["procgen_flowcharts.py", "test_procgen_flowcharts.py"]
