  "τ = 18.5 sqrt(pCO2) + 2.89 sqrt(pH2O)",
  "  + 1.55 (75.6 K/T_eq)² sqrt(pN2), p in bar",
  "p_i = M_i g / 4πR², held at saturation pressure",
  "constants fixed on Venus, Earth and Titan",
  "T_s never above the hottest host's T_eff",
  "planned: CO2 constant refit on measured Venus (T57.a)",
]
cite = ["McKay, Pollack & Courtin 1991"]
