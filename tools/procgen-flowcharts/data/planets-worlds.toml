[[node]]
id = "pw.samples"
label = "Field samples"
kind = "query"
cluster = "pw.biota"
summary = "A scoop's living and abiotic contents, made on demand"
detail = [
  "keyed by the site's finest surface_cell:",
  "  instance 0 the community, n + 1 the nth scoop",
  "rarefaction at the analysis's effective depth",
  "places taxa: form, metabolism, then species",
]
cite = ["Louca et al. 2019", "Jain et al. 2018"]
source = ["docs/agent/brainstorming/life-and-planet-content.md"]
status = "planned"

[[node]]
id = "pw.resources"
label = "Resource abundances"
kind = "draw"
cluster = "pw.geo"
summary = "11 resource fractions x one 0.3 dex lognormal each"
detail = [
  "iron group ~ 10^[Fe/H]; α elements ~ [α/Fe]",
  "platinum group poor where the body differentiated",
  "helium-3 and deuterium for giants",
  "radioactives decay with age",
]
source = ["P14.T26"]
status = "planned"

[[node]]
id = "pw.deposits"
label = "Ore deposits"
kind = "draw"
cluster = "pw.geo"
summary = "Processes on permissive tracts; Poisson per tract"
detail = [
  "porphyry at arcs, VMS at ridges, BIF by stage",
  "count by tract-area regression (Singer 2008)",
  "log-normal tonnage and grade per type",
  "server-only list; 1e3-1e4 on an Earth",
]
cite = ["Singer 2008", "Cox & Singer 1986", "Sillitoe 2010"]
source = ["docs/agent/brainstorming/life-and-planet-content.md"]
status = "planned"

[[node]]
id = "pw.landmarks"
label = "Geological landmarks"
kind = "draw"
cluster = "pw.geo"
summary = "Lava tubes, vents, plumes, dunes, karst, peaks"
detail = [
  "tube width ~ g^-1.8; skylights are height pits",
  "hydrothermal list shared with massive sulfides",
  "plumes on ocean moons, output by orbital phase",
  "proposed detail tags surface.dune, surface.doline",
]
cite = ["Sauro et al. 2020", "Hedman et al. 2013", "Kok et al. 2012"]
source = ["docs/agent/brainstorming/life-and-planet-content.md"]
status = "planned"

[[node]]
id = "pw.surface_events"
label = "Geyser eruptions"
kind = "draw"
cluster = "pw.geo"
summary = "Proposed body.geyser (0x0501): monotone-phase eruptions"
detail = [
  "members of the hydrothermal list on silicic crust",
  "a long eruption is followed by a long wait",
  "P14.T31.b's monotone-phase construction",
  "one clock per body until EventSubject gains items",
  "EventKey: one block under the Event tag",
  "0x0501 is unallocated in code (request 22)",
]
source = ["docs/agent/brainstorming/life-and-planet-content.md", "P14.T31.b"]
status = "planned"

[[node]]
id = "pw.designation"
label = "Catalogue designations"
kind = "draw"
cluster = "pw.text"
summary = "Feistel permutation keyed once per body"
detail = [
  "round keys from body.life.designation",
  "unique across epochs; reveals no rank or kin",
  "only the server can invert it",
]
source = ["docs/agent/brainstorming/life-and-planet-content.md"]
status = "planned"

[[node]]
id = "pw.enrich"
label = "LLM description text"
kind = "enrich"
cluster = "pw.text"
summary = "An LLM writes text from fact sheets, never seeds"
detail = [
  "fact sheet: a fold of Knowledge, never the truth",
  "keyed (subject, rung, fact-sheet digest)",
  "enrichment/enrichment.v1.jsonl: model, prompt version",
  "stored; never feeds back into simulation values",
  "superseded, and kept, when the digest changes",
  "lives in hyperion-server; store.rs reserves the dir",
]
source = ["docs/agent/brainstorming/galaxy-generation.md", "docs/agent/brainstorming/life-and-planet-content.md", "crates/hyperion-server/src/universe/store.rs"]
status = "planned"

