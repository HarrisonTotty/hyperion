  "stripped, remnant.type, remnant.fallback: 1 mark each",
  "remnant.mass: one standard normal (2 words)",
  "kick.score: 8 normal tries (16 words), first ξ > 0",
  "kick.mode: 1 mark; kick.low: 3 normals; direction 2",
]
source = ["crates/hyperion-sim/src/stellar/draws.rs", "crates/hyperion-sim/src/rng/tags.rs", "P06.T2"]
