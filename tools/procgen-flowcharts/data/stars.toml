# ---------------------------------------------------------------------------------------------
# Seed path

[[node]]
id = "s.key_body"
label = "Star body indices (BodyId)"
kind = "seed"
cluster = "s.c_seed"
summary = "Stars take slot 0, subs 0-15; sub 0 is the primary"
detail = [
  "stars take body indices 0-15 (STAR_BODY_INDEX_END)",
  "spine companion k is body k, depth-first order",
  "direct construction: indices given after sorting",
  "spine pair's binary.* key: the star it brings in",
  "direct pair's key: its draw slot (1-3, 4-6 subsystems)",
  "the brown-dwarf companion is the system's last body",
]
source = ["crates/hyperion-sim/src/id/mod.rs", "crates/hyperion-sim/src/stellar/multiplicity/hierarchy.rs", "P11.T2.a"]
status = "built"

[[node]]
id = "s.attempt"
label = "Redraw attempt block (64 words)"
kind = "seed"
cluster = "s.c_seed"
summary = "Attempt k reads words 64k to 64k+63 of every stream"
detail = [
  "StarDraws::for_attempt and RedrawAttempt share it",
  "grid records: attempt 0; feature members carry theirs",
  "MAX_REDRAWS = 8 attempts (0-7) of a system's binaries",
  "each word read by number: random access, order-free",
  "the primary's draws are never redrawn by the carve",
  "every stream above but system.metallicity",
]
source = ["crates/hyperion-sim/src/stellar/draws.rs", "crates/hyperion-sim/src/stellar/multiplicity/hierarchy.rs", "P06.T2", "P11.T7"]
status = "built"

[[node]]
id = "s.st_metal"
label = "system.metallicity"
kind = "seed"
cluster = "s.c_seed_sys"
summary = "Two words: one Box-Muller standard normal per system"
source = ["crates/hyperion-sim/src/rng/tags.rs", "crates/hyperion-sim/src/stellar/system.rs", "P06.T3"]
status = "built"

[[node]]
id = "s.st_mult"
label = "system.multiplicity"
kind = "seed"
cluster = "s.c_seed_sys"
summary = "Marks of attempt n at words 64n, 64n+1, 64n+2, 64n+3+k"
detail = [
  "64n: multiple or not",
  "64n+1: the companion count",
  "64n+2: spine or direct construction (1.5-3 M☉)",
  "64n+3+k: direct companion k's subsystem, k = 1-3",
]
source = ["crates/hyperion-sim/src/rng/tags.rs", "crates/hyperion-sim/src/stellar/multiplicity/hierarchy.rs", "P11.T2.a"]
status = "built"

[[node]]
id = "s.st_substellar"
label = "system.substellar"
kind = "seed"
cluster = "s.c_seed_sys"
summary = "64n: whether; try r at words 64n+1+7r to 64n+7+7r"
detail = [
  "per try: window-and-period mark, q, e, cos i,",
  "  node, periapsis, mean anomaly (one word each)",
  "9 tries fit an attempt's 64-word block",
]
source = ["crates/hyperion-sim/src/rng/tags.rs", "crates/hyperion-sim/src/stellar/multiplicity/substellar.rs", "P11.T2.d"]
status = "built"

[[node]]
id = "s.st_binary"
label = "binary.orbit/orientation/phase"
kind = "seed"
cluster = "s.c_seed_body"
summary = "Three tags keyed by BodyId: spine body or direct slot"
detail = [
  "binary.orbit, try r at 64n+3r: node-and-period mark,",
  "  then mass-ratio and eccentricity ranks",
  "binary.orientation, 64n+3r..+2: cos i, node, periapsis",
  "binary.phase, word 64n+r: mean anomaly at the epoch",
  "direct tries past 21 keyed by draw slot k + 8",
]
source = ["crates/hyperion-sim/src/rng/tags.rs", "crates/hyperion-sim/src/stellar/multiplicity/hierarchy.rs", "P11.T2.a"]
status = "built"

[[node]]
