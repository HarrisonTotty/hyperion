# ---------------------------------------------------------------------------------------------
# Slot inputs and composition

[[node]]
id = "s.ctx"
label = "Multiplicity context"
kind = "decision"
cluster = "s.c_slot"
summary = "Free (grid star), ForcedSingle, or ForcedMultiple"
detail = [
  "grid star: Free, the model's own hierarchy draw",
  "brown dwarf or rogue planet record: ForcedSingle",
  "feature member: binary class ForcedMultiple, else",
  "  ForcedSingle; no width cap passed yet (P11.T8.f)",
  "ForcedSingle gives plan 06's single-star system",
]
source = ["crates/hyperion-sim/src/stellar/system.rs", "crates/hyperion-sim/src/stellar/multiplicity/hierarchy.rs", "crates/hyperion-sim/src/galaxy/features/members.rs", "P11.T2.c"]
status = "built"

[[node]]
id = "s.draw_feh"
label = "[Fe/H] per system"
kind = "draw"
cluster = "s.c_slot"
summary = "Normal of the slot's component at its position and age"
detail = [
  "[Fe/H] = mean + σ z, z on system.metallicity",
  "a system not yet born reads the law at age 0",
  "fixed at birth: independent of the query time",
  "thin disc at the solar circle: solar mean, σ 0.2 dex",
]
source = ["crates/hyperion-sim/src/stellar/system.rs", "P06.T3", "P02.T7.e"]
status = "built"

[[node]]
id = "s.composition"
label = "Composition (Z, z_fit, ΔY)"
kind = "model"
cluster = "s.c_slot"
summary = "Z = 0.02 × 10^[Fe/H]; the fits see Z held to 1e-4 to 0.03"
detail = [
  "Z☉ = 0.02, the metal fraction HPT were fitted at",
  "[Fe/H] kept as drawn for consoles and planets",
  "grid systems: helium excess ΔY = 0",
  "feature members bring their cluster's composition",
  "[α/Fe] is not drawn and does not enter the fits",
]
cite = ["Hurley, Pols and Tout 2000"]
source = ["crates/hyperion-sim/src/stellar/composition.rs", "P06.T1.a", "P06.T3"]
status = "built"

