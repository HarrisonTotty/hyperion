  "star.magnetism: 1 mark; star.spin_axis: 2 (isotropic)",
  "star.disc_lifetime: 1 rank; star.nebula: 1 rank",
]
source = ["crates/hyperion-sim/src/stellar/draws.rs", "crates/hyperion-sim/src/rng/tags.rs", "P06.T2"]
