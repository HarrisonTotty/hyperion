cluster = "ps.cl_zones"
summary = "Holman & Wiegert 1999 fits at every hierarchy level"
detail = [
  "S-type: least over pairs above of a_L hw_s(μ, e_L)",
  "  × (1 - ρ / (a_L (1 - e_L))), at closest approach",
  "P-type inner edge a hw_p(μ, e), μ folded, μ ≥ 0.1",
  "continued outside fitted μ, e where a clamp errs big",
  "pair zones narrower than ×1.5 in radius dropped",
  "evolved-binary intersection (D10) not built",
]
cite = ["Holman & Wiegert 1999", "Jaime, Aguilar & Pichardo 2014", "Pichardo et al. 2005"]
source = ["crates/hyperion-sim/src/planetary/placement/zones.rs", "P14.T9.a", "P14.T9.b"]
status = "partial"

[[node]]
id = "ps.zone_kind"
label = "Zone host: star or pair?"
kind = "decision"
cluster = "ps.cl_zones"
summary = "Circumstellar (S-type) or circumbinary (P-type) host"
detail = [
  "star n: host number n; pair k: 16 + k; root Barycentre",
  "star: disc from its own zero-age state and lifetime",
  "pair: total mass, summed L_ZAMS, own lifetime rank w6",
  "each zone is an independent orbit host (D10)",
]
source = ["crates/hyperion-sim/src/planetary/placement/zones.rs", "P14.T9.c"]
status = "built"

[[node]]
id = "ps.host_plane"
label = "Host planetary plane"
kind = "draw"
cluster = "ps.cl_zones"
