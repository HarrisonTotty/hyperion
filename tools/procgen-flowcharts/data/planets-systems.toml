  "planet.plane words 4h, 4h+1: cos i and node",
  "circumbinary zone of a pair < 47 au: pair's plane",
  "reference plane of the SYSTEM orbit map (D21)",
]
source = ["crates/hyperion-sim/src/planetary/placement/classes/orbits.rs", "crates/hyperion-sim/src/planetary/system.rs", "P14.T8.d"]
status = "built"

# ---------------------------------------------------------------- disc

[[node]]
