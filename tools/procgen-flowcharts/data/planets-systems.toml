  "planet.disc words 16h to 16h+6 (16 words per host)",
  "log10(M_d/M*) ~ N(-2.0, 0.5), capped at -1.0",
  "corotation period 8 d × 10^N(0, 0.25 dex)",
  "r_c = 30 au (M*/M☉)^0.5 × 10^N(0, 0.3 dex)",
  "w6: a circumbinary disc's lifetime rank; circumstellar",
