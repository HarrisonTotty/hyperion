# Procedural Generation Flowchart - Planets, first half: from a finished star system to its
# planetary system (planets, moons, belts, rings, halo) and the per-body bulk record.
# Read from rendering-and-planets at a6d3f6dd (GENERATOR_VERSION 21).

[meta]
stage = "planets"
part = "planets-systems"
prefix = "ps"
title = "Planets"
snapshot = "25d5d636"

# ---------------------------------------------------------------- clusters

[[cluster]]
id = "ps.cl_seed"
label = "Seed & stream keys"

[[cluster]]
id = "ps.cl_ctx"
label = "System context"

[[cluster]]
id = "ps.cl_zones"
label = "Orbit hosts & stable zones"

[[cluster]]
id = "ps.cl_disc"
label = "Protoplanetary disc"

[[cluster]]
id = "ps.cl_arch"
label = "Architecture class"

[[cluster]]
id = "ps.cl_place"
label = "Placement"

[[cluster]]
id = "ps.cl_fate"
label = "Formation & fate in time"

[[cluster]]
id = "ps.cl_bulk"
label = "Bulk derivation"

[[cluster]]
id = "ps.cl_spin"
label = "Spin, tides & figure"

[[cluster]]
id = "ps.cl_moons"
label = "Moons & rings"

[[cluster]]
id = "ps.cl_belts"
label = "Belts, halo & events"

[[cluster]]
id = "ps.cl_out"
label = "Records & queries"

# ---------------------------------------------------------------- seed & keys

[[node]]
id = "ps.key_body"
label = "Planetary body index (BodyId)"
kind = "seed"
cluster = "ps.cl_seed"
summary = "Planets, moons, rings, belts: a 16-bit index each"
detail = [
  "index = slot << 8 | sub (D3), in counter word 1",
  "slots 0x01-0xBF planets, 0xC0-0xCF 2nd gen, 0xE0-0xEF",
  "  belts, discs, halo; slot 0x00 is the stellar level",
  "subs 0x00 body, 0x01-0x7F moons, 0x80-0x8F rings",
  "a moon's own draws use its candidate key (r. 112.5):",
  "regular k at sub k, impact 0x10, captures 0x20+/0x30+",
]
source = ["crates/hyperion-sim/src/planetary/index.rs", "crates/hyperion-sim/src/id/mod.rs", "crates/hyperion-sim/src/planetary/satellites.rs", "P14.T1.c", "P14.T22.a"]
status = "built"

[[node]]
id = "ps.surface_seed"
label = "Surface seed"
kind = "seed"
cluster = "ps.cl_seed"
summary = "body.surface word 0: a function of seed and BodyId only"
detail = [
  "no derivation change can move a map (P14.T23)",
  "server-only: no wire type carries it (R04)",
  "clients get body.surface.detail instead (R09.T1.b)",
]
source = ["crates/hyperion-sim/src/planetary/hooks/seed.rs", "crates/hyperion-sim/src/rng/tags.rs", "P14.T23"]
status = "built"

# ---------------------------------------------------------------- context

[[node]]
id = "ps.context"
label = "SystemContext"
kind = "model"
cluster = "ps.cl_ctx"
summary = "Stars, hierarchy, [Fe/H], age and sphere of influence"
detail = [
  "for_system: resolve record, SystemStars, metallicity",
  "[α/Fe] closed form of [Fe/H] and population: thick",
  "  disc, halo, bulge +0.30 to -0.5, then -0.36 per dex;",
  "  thin disc -0.13 per dex through solar, floor -0.05",
  "slice: binaries evolve as single stars, zones at birth",
  "builder(): synthetic hosts for tests and tools",
]
cite = ["Bensby, Feltzing & Oey 2014", "Hayden et al. 2015"]
source = ["crates/hyperion-sim/src/planetary/context.rs", "P14.T1.a", "P14.T1.d"]
status = "built"

[[node]]
id = "ps.host_kind"
label = "Host kind"
kind = "decision"
cluster = "ps.cl_ctx"
summary = "Stellar path built; brown-dwarf and rogue hosts planned"
detail = [
  "every context is HostKind::Stellar at this commit",
  "for_system refuses the brown-dwarf and rogue layers",
  "a bound brown dwarf is a component: its own zone",
  "  draws the built SubstellarCompact row",
  "plan 13 places free-floating objects; P14.T27",
  "  gives them contexts",
]
source = ["crates/hyperion-sim/src/planetary/context.rs", "P14.T27"]
status = "partial"

[[node]]
id = "ps.free_hosts"
label = "Substellar & rogue hosts"
kind = "model"
cluster = "ps.cl_ctx"
summary = "Brown dwarfs on the SubstellarCompact row; rogues' moons"
detail = [
  "T27.a: Barren 0.5, chain 0.5 at 0.05 M☉, 0.2 at 13 MJ",
  "BD light from its cooling state at age + t",
  "rogue: the object is body 0x0000, internal heat only",
  "rogue < 1 MJ (ejected) keeps moons inside 0.1 R_H",
  "  of a drawn birth orbit",
]
cite = ["Hong et al. 2018"]
source = ["P14.T27.a", "P14.T27.b"]
status = "planned"

[[node]]
id = "ps.xuv"
label = "XUV history"
kind = "model"
cluster = "ps.cl_ctx"
summary = "Saturated at 10^-3.5 L_ZAMS, then (t/t_sat)^-1.5"
detail = [
  "t_sat 1 Gyr ≤ 0.30 M☉, 250 Myr 0.35-0.6, 100 Myr ≥ 0.7",
  "  blended log-linearly between (ruling 122.2)",
  "closed form of initial mass and L_ZAMS: monotone",
  "plan 06 ActivityLevel not read (fluence must not fall)",
  "its fluence drives envelope escape",
]
cite = ["Ribas et al. 2005", "Owen & Wu 2017", "Johnstone et al. 2021", "Loyd et al. 2021"]
source = ["crates/hyperion-sim/src/planetary/context.rs", "P14.T1.a"]
status = "built"

[[node]]
id = "ps.strip"
label = "Strip radius"
kind = "model"
cluster = "ps.cl_ctx"
summary = "0.4895 × sphere of influence: nothing generated beyond"
detail = [
  "interim sphere: galactic tidal radius at the position",
  "(G m / (4Ω² - κ²))^(1/3) of the system mass:",
  "  1.372 pc for 1 M☉ with Bovy's Oort constants",
  "cuts the discs (T3.b) and the cometary halo (T21.d)",
  "T29 not built: no encounter-radius cut at the age,",
  "  no feature or central-black-hole rule",
]
cite = ["Domingos, Winter & Yokoyama 2006", "King 1962", "Jiang & Tremaine 2010", "Bovy 2017"]
source = ["crates/hyperion-sim/src/planetary/context.rs", "crates/hyperion-sim/src/planetary/params.rs", "P14.T1.d", "P14.T29"]
status = "partial"

# ---------------------------------------------------------------- zones

[[node]]
