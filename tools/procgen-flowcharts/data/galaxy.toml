kind = "model"
cluster = "g.fields"
summary = "Level to 0.85 L, Gaussian end 0.15 L; ages 6-10 Gyr"
detail = [
  "n0 L(|x|) exp(-y²/2σ_y²) exp(-|z|/h); defines the x axis",
