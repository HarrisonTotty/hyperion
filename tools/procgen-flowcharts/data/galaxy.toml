[[node]]
id = "g.size_coupling"
label = "Sizes coupled to mass^(1/3)"
kind = "model"
cluster = "g.params"
summary = "MW size × (M / M_MW)^(1/3) × 10^scatter, clamped"
detail = [
  "Thin R_d 8,480 ly at 3.4e10 M☉, clamp 7,000-11,500 ly",
  "Bulge long axis 2,300 ly at 1.3e10, clamp 1,700-3,000 ly",
  "Bar half-length 16,000 ly at 5.6e9, clamp 10,000-18,000",
  "Nuclear disc 290 ly at 1.05e9 M☉, clamp 200-400 ly",
  "Independent draws gave 390 km/s at 1 kpc, so rejected",
]
cite = ["Bland-Hawthorn & Gerhard 2016", "Wegg, Gerhard & Portail 2015", "Sormani et al. 2022"]
source = ["crates/hyperion-sim/src/galaxy/params/derive.rs", "P02.T5.b"]
status = "built"

# ---------------------------------------------------------------------------------------------
# Mass model and potential
# ---------------------------------------------------------------------------------------------

[[node]]
id = "g.mge"
label = "MGE coefficient tables"
kind = "table"
cluster = "g.potential"
summary = "Gaussian sums for exp, holed exp and bar (provisional)"
detail = [
  "14 fixed log-spaced widths, NNLS by coordinate descent",
  "MGE_EXP within 1.289% of e^-s over s = 0.05-10",
  "MGE_BAR within 2.88% of its centre; mass within 0.212%",
  "Free-width refit and a boxy bulge table planned (P15.T3)",
]
cite = ["Emsellem, Monnet & Bacon 1994"]
source = ["crates/hyperion-sim/src/tables/mge.rs", "crates/hyperion-fit/src/tasks/mge.rs", "P02.T6.a", "P15.T3"]
status = "built"

[[node]]
id = "g.halo_nfw"
label = "NFW dark halo"
kind = "model"
cluster = "g.potential"
summary = "M200 = M* / (0.157 f*); c200 after Dutton & Maccio 2014"
detail = [
  "log c = 0.905 - 0.101 log(M200 h / 1e12 M☉) + scatter",
  "h = 0.671; r200 at 200 ρ_crit; finite escape speed",
  "MW: M200 1.16e12 M☉ (McMillan 2017: 1.3 ± 0.3e12)",
]
cite = ["Navarro, Frenk & White 1997", "Dutton & Maccio 2014", "McMillan 2017"]
source = ["crates/hyperion-sim/src/galaxy/params/derive.rs", "crates/hyperion-sim/src/galaxy/potential/nfw.rs", "P02.T5.b", "P02.T6"]
status = "built"

[[node]]
id = "g.mass_model"
label = "Mass model"
kind = "model"
cluster = "g.potential"
summary = "≈936 Gaussians + NFW + nuclear cluster + BH point mass"
detail = [
  "Order: thin+young (holed), thick, gas, nuclear main, nuclear",
  "inner, bar, bulge; then NFW, nuclear cluster, black hole",
  "Each Gaussian's force is a 1D integral on 32 GL nodes",
  "Gas disc (drawn mass, length): plain double exponential",
  "Bulge is a moment-matched spheroid (no fitted boxy table)",
]
cite = ["Binney & Tremaine 2008", "Cappellari 2002"]
source = ["crates/hyperion-sim/src/galaxy/potential/model.rs", "crates/hyperion-sim/src/galaxy/potential/mge.rs", "P02.T6.b"]
status = "built"

[[node]]
id = "g.potential_tables"
label = "Potential tables"
kind = "model"
cluster = "g.potential"
summary = "v_c, Ω, κ, Φ in plane; 64×64 (R, |z|) grid on request"
detail = [
  "64 log points 2^-4 to 2^18 ly; cubic Hermite in ln R",
  "Grid by with_full_potential (≈2 s): Φ and forces off-plane",
  "Escape speed to 2 r200: 512 km/s at 26,000 ly (MW)",
  "Tidal radius (G m / (4Ω² - κ²))^(1/3), floor 0.05 Ω²",
  "Bar pattern speed Ω(corotation); MW test 33-41 km/s/kpc",
]
cite = ["Deason et al. 2019", "Piffl et al. 2014"]
source = ["crates/hyperion-sim/src/galaxy/potential/tables.rs", "P02.T6.d"]
status = "built"

# ---------------------------------------------------------------------------------------------
# Population fields
# ---------------------------------------------------------------------------------------------

[[node]]
id = "g.thin_disc"
label = "Thin disc: young + 5 sub-discs"
kind = "model"
cluster = "g.fields"
summary = "Σ ~ exp(-R_h/R - R/R_d), central hole R_h = 0.55 R_d"
detail = [
  "Young disc: ages -H to 100 Myr, sharp arms",
  "Old sub-discs by age 0.1-1, 1-2, 2-4, 4-7, 7-10 Gyr",
  "Each normalised to its share × N, over all space",
  "Cell bound: exp at nearest radius, hole at the farthest",
]
cite = ["Dehnen & Binney 1998", "Lopez-Corredoira et al. 2004", "Bovy & Rix 2013"]
source = ["crates/hyperion-sim/src/galaxy/fields/disc.rs", "crates/hyperion-sim/src/galaxy/fields/sub_discs.rs", "P02.T7.a", "P02.T12.b"]
status = "built"

[[node]]
id = "g.vertical"
label = "Vertical Jeans profiles"
kind = "model"
cluster = "g.fields"
summary = "Cored profiles from the Jeans eq. in the model potential"
detail = [
  "σ_z = s × 21.1 km/s ((τ+0.1)/10.1)^0.441 (1 + 0.20|z|/kpc)",
  "Rise stops at 2 kpc; s is fixed by the drawn mean height",
  "Solved at the solar radius 3.8 R_d (nuclear disc at 2 L)",
  "E(z) tabulated at 705 knots, monotone bit for bit",
  "Serves young, sub-, thick and nuclear discs alike",
]
cite = ["Sharma et al. 2021", "Bovy 2017"]
source = ["crates/hyperion-sim/src/galaxy/fields/vertical.rs", "crates/hyperion-sim/src/galaxy/fields/sub_discs.rs", "P02.T7.b"]
status = "built"

[[node]]
id = "g.thick_disc"
label = "Thick disc"
kind = "model"
cluster = "g.fields"
summary = "Exponential, cored (Jeans), no hole; ages U(10, 12) Gyr"
detail = [
  "Length 0.7-0.9 and height 2.7-3.3 × the thin disc's",
  "MW fixture: 1.93 kpc × 935 pc; 8-14% of systems",
]
cite = ["Bland-Hawthorn & Gerhard 2016"]
source = ["crates/hyperion-sim/src/galaxy/fields/disc.rs", "crates/hyperion-sim/src/galaxy/ages.rs", "P02.T7.a"]
status = "built"

[[node]]
id = "g.bulge"
label = "Boxy triaxial bulge"
kind = "model"
cluster = "g.fields"
summary = "n0 exp(-m), boxy vertical exponent 3-4; ages 8-12 Gyr"
