# HYPERION procedural generation: the galaxy stage.
# Read from rendering-and-planets at a6d3f6dd (GENERATOR_VERSION 21). Code is the authority;
# planned steps come from docs/agent/plans/galaxy-generation and the galaxy brainstorm.

[meta]
stage = "galaxy"
part = "galaxy"
prefix = "g"
title = "Galactic Properties & Megastructures"
snapshot = "25d5d636"

# ---------------------------------------------------------------------------------------------
# Clusters
# ---------------------------------------------------------------------------------------------

[[cluster]]
id = "g.det"
label = "Determinism backbone"

[[cluster]]
id = "g.params"
label = "Galaxy parameters"

[[cluster]]
id = "g.potential"
label = "Mass model and potential"

[[cluster]]
id = "g.fields"
label = "Population fields"

[[cluster]]
id = "g.gas"
label = "Gas and dust"

[[cluster]]
id = "g.features"
label = "Feature catalogue: clusters, nebulae"

[[cluster]]
id = "g.centre"
label = "Galactic centre"

[[cluster]]
id = "g.global"
label = "Global list: streams, dwarfs"

[[cluster]]
id = "g.place"
label = "Grid placement"

[[cluster]]
id = "g.motion"
label = "Kinematics and displaced objects"

[[cluster]]
id = "g.classes"
label = "Catalogue classes and SNRs"

[[cluster]]
id = "g.query"
label = "Runtime access"

# ---------------------------------------------------------------------------------------------
# Determinism backbone
# ---------------------------------------------------------------------------------------------

[[node]]
id = "g.seed"
label = "Universe seed (u64)"
kind = "seed"
cluster = "g.det"
summary = "Any u64; text form is exactly 16 lower-case hex digits"
detail = [
  "Key word 0 of every stream; universe = (seed, version)",
  "Keys are built from integers only; float bits never hashed",
]
source = ["crates/hyperion-base/src/rng/key.rs", "P01.T7.c"]
status = "built"

[[node]]
id = "g.gen_version"
label = "GENERATOR_VERSION = 21"
kind = "param"
cluster = "g.det"
summary = "Gates all output; only the current version generates"
detail = [
  "Covers block function, key layout, tag hash, word-to-float,",
  "sampler algorithms and word use, threshold rule, event keys,",
  "pinned libm, H and L, ID layouts and the fitted tables",
  "Not in the stream key: a bump moves only what code moves",
  "Golden files fail CI until a bump is deliberate",
]
source = ["crates/hyperion-base/src/version.rs", "crates/hyperion-sim/src/tables/mod.rs", "P01.T3"]
status = "built"

[[node]]
id = "g.stream"
label = "Threefry2x64-20 stream"
kind = "seed"
cluster = "g.det"
summary = "Key (seed, FNV-1a tag hash); counter (word, sub, block)"
detail = [
  "Domain tags: registered names, never renamed, one scope each",
  "(Galaxy, Cell, Feature, System, Body, ...); open checks it",
  "Counter word 1 = sub << 48 | block; 2^49 words per stream",
  "uniform = (w >> 11) × 2^-53; normal by Box-Muller pair",
  "Poisson: inversion below mean 10, PTRS from 10 up",
  "Decisions: mark w >> 11 against ceil(p × 2^53)",
]
cite = ["Salmon et al. 2011", "Hormann 1993"]
source = [
  "crates/hyperion-base/src/rng/stream.rs",
  "crates/hyperion-base/src/rng/threefry.rs",
  "crates/hyperion-base/src/rng/domain_tag.rs",
  "crates/hyperion-base/src/rng/decide.rs",
  "crates/hyperion-base/src/rng/sample/poisson.rs",
  "crates/hyperion-sim/src/rng/tags.rs",
  "P01.T7.a",
  "P01.T7.b",
  "P01.T8.d",
  "P01.T9",
]
status = "built"

[[node]]
id = "g.key_galaxy"
label = "Key: galaxy() / galaxy_item(n)"
kind = "seed"
cluster = "g.det"
summary = "Counter word 0 = 0, or item n of a galaxy-wide list"
detail = [
  "Scalar parameters on galaxy(); lists on galaxy_item(n)",
  "Progenitors: dominant 0, lesser 1-5, recent 6 + j",
  "Halo items: in situ 0, dominant 1, lesser 2-6, debris 7",
  "gas.noise: item = packed lattice word (octave, i, j, k)",
  "Orphan stream k: item k; a dwarf: its progenitor's n",
]
source = ["crates/hyperion-base/src/rng/key.rs", "crates/hyperion-sim/src/galaxy/params/draws.rs", "P02.T5.a"]
status = "built"

[[node]]
id = "g.key_cell"
label = "Key: cell(word)"
kind = "seed"
cluster = "g.det"
summary = "Cell word = ID of the cell's candidate 0, index zeroed"
detail = [
  "Grid cells: SystemId::cell_word; feature cells: the word of",
  "FeatureRef(cell, 0); nested cells: candidate 0 in its band",
  "Counts: one stream per cell and tag; cells independent",
]
source = ["crates/hyperion-base/src/rng/key.rs", "crates/hyperion-sim/src/galaxy/placement/cell.rs", "P03.T3"]
status = "built"

[[node]]
id = "g.key_feature"
label = "Key: feature(word)"
kind = "seed"
cluster = "g.det"
summary = "FeatureRef object word: 4,096 ly cell + 14-bit index"
detail = [
  "Index = candidate number + counts of the earlier processes",
  "Opens every per-feature mark stream (feature.*)",
]
source = ["crates/hyperion-sim/src/id/reserved.rs", "crates/hyperion-sim/src/galaxy/features/ids.rs", "P09.T1"]
status = "built"

[[node]]
id = "g.key_system"
label = "Key: from(SystemId / BodyId)"
kind = "seed"
cluster = "g.det"
summary = "64-bit system or member ID as counter word 0"
detail = [
  "Candidate draws are keyed by the candidate's own ID, so",
  "other candidates of the cell never shift them",
  "BodyId: the system's word, sub = body index, scope Body",
  "Index layouts belong to the stellar and planetary stages",
]
source = [
  "crates/hyperion-base/src/rng/key.rs",
  "crates/hyperion-sim/src/id/mod.rs",
  "crates/hyperion-sim/src/id/system.rs",
  "crates/hyperion-sim/src/id/body.rs",
  "P01.T7.c",
]
status = "built"

[[node]]
id = "g.event_key"
label = "Event key (two-step)"
kind = "seed"
cluster = "g.det"
summary = "One block of (seed, event tag; ID) keys the bin streams"
detail = [
  "Step 2 counter: (bin or cycle k, slot << 48 | block)",
  "Slot 0 is the bin's own stream; slot j + 1 is event j's",
  "Event word: 16-bit tag, signed 40-bit bin, 8-bit number",
  "class.ev.supernova backs event tag 0x0202 (catalogue SNe)",
  "Stars: star.var.cycle 0x0109; star.ev.* 0x0100-0x0108",
]
source = [
  "crates/hyperion-sim/src/rng/event.rs",
  "crates/hyperion-sim/src/id/event.rs",
  "crates/hyperion-sim/src/id/event_tags.rs",
  "crates/hyperion-sim/src/events/mod.rs",
  "P01.T6.e",
  "P01.T10",
  "P06.T27.a",
]
status = "built"

# ---------------------------------------------------------------------------------------------
# Galaxy parameters
# ---------------------------------------------------------------------------------------------

[[node]]
id = "g.mw_fixture"
label = "Milky Way fixture"
kind = "param"
cluster = "g.params"
summary = "Measured values in place of draws (milky_way_like)"
detail = [
  "M* 5.12e10 M☉; thick 8%, bulge+bar 35% (bar 30%),",
  "nuclear disc 2.06%, halo 1%; τ 7 Gyr; thin 7,000 × 1,130 ly",
  "Bar 16,000 ly, corotation 1.24; nuclear disc 290 × 93 ly",
  "4 arms at 12°; f* 0.28 → M200 1.16e12 M☉; gas 29.3% of thin",
  "BH -0.384 dex below M-σ → 4.30e6 M☉ (Sgr A*)",
]
cite = ["Bland-Hawthorn & Gerhard 2016", "Portail et al. 2017", "Sormani et al. 2022", "GRAVITY Collaboration 2022", "McMillan 2017"]
source = ["crates/hyperion-sim/src/galaxy/params/milky_way.rs", "P02.T5.c"]
status = "built"

[[node]]
id = "g.imf"
label = "Mass function (fitted IMF)"
kind = "table"
cluster = "g.params"
summary = "Chabrier 2003 system IMF, >1 M☉ branch × 0.920 (default)"
detail = [
  "Log-normal m_c 0.22 M☉, σ 0.57 dex to 1 M☉; m^-2.3 above",
  "Scale s = 0.9201 fitted to the 20 pc census (P15.T4.b)",
  "Kroupa 2001 alternative: slopes 1.3 / 2.3, break 0.5 M☉",
  "Stellar range 0.08-150 M☉; substellar branch to 0.01 M☉",
  "Band shares are integrated, never constants; default A-E",
  "67 / 12 / 17 / 3.4 / 0.95 %",
]
cite = ["Chabrier 2003", "Kroupa 2001", "Kirkpatrick et al. 2024"]
source = [
  "crates/hyperion-sim/src/galaxy/imf.rs",
  "crates/hyperion-sim/src/tables/chabrier.rs",
  "crates/hyperion-fit/src/tasks/chabrier.rs",
  "P02.T2",
  "P15.T4.b",
]
status = "built"

[[node]]
id = "g.draw_mass"
label = "Stellar mass M*"
kind = "draw"
cluster = "g.params"
summary = "Log-uniform 3-10 × 10^10 M☉, one word"
detail = ["lo × (hi/lo)^u, clamped to the range"]
source = ["crates/hyperion-sim/src/galaxy/params/draws.rs", "P02.T5.a"]
status = "built"

[[node]]
id = "g.draw_shares"
label = "Population shares and SFH"
kind = "draw"
cluster = "g.params"
summary = "Shares of systems; thin disc takes the rest; τ 5-9 Gyr"
detail = [
  "Thick 0.08-0.14; bulge+bar 0.20-0.35, bar 0.30-0.40 of it",
  "Nuclear disc 0.010-0.025; halo 0.007-0.014 (uniform)",
  "SFH: thin-disc rate ~ exp(age/τ) over 10 Gyr, τ U(5, 9) Gyr",
  "Young share = expm1(0.1/τ) / expm1(10/τ): 0.32-0.55%",
]
cite = ["Bland-Hawthorn & Gerhard 2016", "Licquia & Newman 2015"]
source = ["crates/hyperion-sim/src/galaxy/params/draws.rs", "crates/hyperion-sim/src/galaxy/ages.rs", "P02.T5.a", "P02.T3"]
status = "built"

[[node]]
id = "g.draw_structure"
label = "Structure, arms and gradient"
kind = "draw"
cluster = "g.params"
summary = "Size scatters, heights, axis ratios, arms, [Fe/H] slope"
detail = [
  "Scatter dex: thin 0.05, bulge 0.06, bar 0.05, nuclear 0.04",
  "Thin mean height 850-1,150 ly; young disc 225-345 ly",
  "Thick L 0.7-0.9, h 2.7-3.3 × thin; bulge b/a 0.5-0.7,",
  "c/a 0.3-0.4, boxiness 3-4; bar width 0.08-0.12 L, h 500-700",
  "ly, corotation 1.0-1.4 L; nuclear h/L 0.3-0.5",
  "Arms 2|4, pitch 10-18°; [Fe/H] grad -0.07..-0.04 dex/kpc",
]
cite = ["Wegg & Gerhard 2013", "Wegg, Gerhard & Portail 2015", "Bovy 2017"]
source = ["crates/hyperion-sim/src/galaxy/params/draws.rs", "crates/hyperion-sim/src/galaxy/params/inputs.rs", "P02.T5.a"]
status = "built"

[[node]]
id = "g.draw_dark"
label = "Dark halo draws"
kind = "draw"
cluster = "g.params"
summary = "f* log-uniform 0.12-0.45; concentration scatter 0.11 dex"
source = ["crates/hyperion-sim/src/galaxy/params/draws.rs", "P02.T5.a"]
cite = ["Dutton & Maccio 2014"]
status = "built"

[[node]]
id = "g.draw_halo"
label = "Stellar halo components"
kind = "draw"
cluster = "g.params"
summary = "In situ, dominant merger, 2-5 lesser, globular debris"
detail = [
  "Shares: in situ 0.15-0.30, dominant 0.35-0.60, lesser",
  "0.10-0.25 (stick-breaking), debris 0.08-0.15; renormalised",
  "q: in situ 0.45-0.55, dominant 0.6-0.8, lesser 0.6-1.0",
  "Inner slope 2.2-2.8 (debris 4.0-4.5); dominant break",
  "52,000-91,000 ly, steepening 1.5-2.5; age mid 10.5-12.5 Gyr",
