[[node]]
id = "g.draw_accretion"
label = "Accretion history"
kind = "draw"
cluster = "g.params"
summary = "Last major merger 6-11 Gyr; recent progenitors Poisson(8)"
detail = [
  "Recent masses dN/dM ~ M^-1.45 on 1e5-10^9.5 M☉, 0-6 Gyr ago",
  "Lesser ones accreted 6-12 Gyr ago, after their last stars",
  "Orbits: apocentre log-U 20,000-200,000 ly, peri 0.05-0.6 apo",
  "Dominant (GSE-like) merger: eccentricity 0.85-0.95",
  "cos i U(-1, 1); node and phase U(0, 2π)",
  "Globular count scatter N(0, 0.2 dex)",
]
cite = ["Belokurov et al. 2018"]
source = ["crates/hyperion-sim/src/galaxy/params/draws.rs", "crates/hyperion-sim/src/galaxy/params/accretion.rs", "P02.T5.a"]
status = "built"

[[node]]
id = "g.system_count"
label = "System count and population mass"
kind = "model"
cluster = "g.params"
summary = "N = M* / Σ(share × mean present mass) ≈ 0.5-1.7e11"
detail = [
