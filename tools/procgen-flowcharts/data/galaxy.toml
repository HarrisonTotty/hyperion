  "Half-length coupled to mass^(1/3); arms fade in at its ends",
]
cite = ["Wegg, Gerhard & Portail 2015", "Portail et al. 2017"]
source = ["crates/hyperion-sim/src/galaxy/fields/bar.rs", "P02.T7.c"]
