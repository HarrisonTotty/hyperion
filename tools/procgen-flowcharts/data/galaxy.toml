[[node]]
id = "g.arms"
label = "Logarithmic spiral arms"
kind = "model"
cluster = "g.fields"
summary = "φ = n(θ + ln(R/L_bar)/tan p); mean 1 around every circle"
detail = [
  "Fade-in (1 + tanh((R - L_bar) / 0.1 L_bar)) / 2",
