  "m = ([(x/a)² + (y/b)²]^(k/2) + |z/c|^k)^(1/k), k = 3-4",
  "Long axis a coupled to mass^(1/3); along the bar (x axis)",
  "MW a, b, c = 2,280, 1,440, 730 ly",
  "Centre ≈ 100× solar-neighbourhood density (0.2-0.35/ly³)",
]
cite = ["Wegg & Gerhard 2013"]
source = ["crates/hyperion-sim/src/galaxy/fields/bulge.rs", "P02.T7.c"]
