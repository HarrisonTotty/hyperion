[[node]]
id = "g.stellar_halo"
label = "Stellar halo mixture"
kind = "model"
cluster = "g.fields"
summary = "Cored, flattened broken power laws; sphere cut 65,000 ly"
detail = [
  "n0 (1 + m²/a²)^(-γ/2) B(m), with m² = x² + y² + z²/q²",
