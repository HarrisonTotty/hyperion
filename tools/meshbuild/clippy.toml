# Clippy configuration for tools/meshbuild alone (plan R14, T5.a): the pages it writes are checked
# byte for byte against SHA-256s built on Linux, so its arithmetic must round alike on every
# platform. Clippy takes the nearest `clippy.toml` and does not merge, so this file shadows the
# workspace root's completely and repeats the shared ban list;
# `crates/hyperion-testkit/tests/clippy_bans.rs` holds it to that list.
#
# Every transcendental function goes through the exactly pinned `libm`: the platform's own
# versions differ between operating systems and CPU architectures. That includes `mul_add`, which
# calls the platform's `fma` where the CPU has none. The `algebraic_*` methods license the compiler
# to fuse and reassociate (Rust's documentation, "Algebraic operators", rustc 1.98.1: "the same
# inputs may produce different results even within a single program run"). Unlike the determinism
# crates' files, this one does not ban the float-bit conversions: writing the page format's `f32`
# and `f64` fields little-endian is the tool's job, and it hashes no float.
disallowed-methods = [
    { path = "f64::sin", reason = "use libm::sin: the platform's maths differs between systems" },
    { path = "f64::cos", reason = "use libm::cos: the platform's maths differs between systems" },
    { path = "f64::tan", reason = "use libm::tan: the platform's maths differs between systems" },
    { path = "f64::sin_cos", reason = "use libm::sincos: the platform's maths differs between systems" },
    { path = "f64::asin", reason = "use libm::asin: the platform's maths differs between systems" },
    { path = "f64::acos", reason = "use libm::acos: the platform's maths differs between systems" },
    { path = "f64::atan", reason = "use libm::atan: the platform's maths differs between systems" },
    { path = "f64::atan2", reason = "use libm::atan2: the platform's maths differs between systems" },
    { path = "f64::sinh", reason = "use libm::sinh: the platform's maths differs between systems" },
    { path = "f64::cosh", reason = "use libm::cosh: the platform's maths differs between systems" },
    { path = "f64::tanh", reason = "use libm::tanh: the platform's maths differs between systems" },
    { path = "f64::asinh", reason = "use libm::asinh: the platform's maths differs between systems" },
    { path = "f64::acosh", reason = "use libm::acosh: the platform's maths differs between systems" },
    { path = "f64::atanh", reason = "use libm::atanh: the platform's maths differs between systems" },
    { path = "f64::exp", reason = "use libm::exp: the platform's maths differs between systems" },
    { path = "f64::exp2", reason = "use libm::exp2: the platform's maths differs between systems" },
    { path = "f64::exp_m1", reason = "use libm::expm1: the platform's maths differs between systems" },
    { path = "f64::ln", reason = "use libm::log: the platform's maths differs between systems" },
    { path = "f64::log", reason = "use libm::log and divide: the platform's maths differs between systems" },
    { path = "f64::log2", reason = "use libm::log2: the platform's maths differs between systems" },
    { path = "f64::log10", reason = "use libm::log10: the platform's maths differs between systems" },
    { path = "f64::ln_1p", reason = "use libm::log1p: the platform's maths differs between systems" },
    { path = "f64::powf", reason = "use libm::pow: the platform's maths differs between systems" },
    { path = "f64::powi", reason = "platform powi has unspecified precision: multiply, or use libm::pow" },
    { path = "f64::cbrt", reason = "use libm::cbrt: the platform's maths differs between systems" },
    { path = "f64::hypot", reason = "use libm::hypot: the platform's maths differs between systems" },
    { path = "f64::mul_add", reason = "without hardware FMA this calls the platform's fma, and the pages are checked byte for byte" },
    { path = "f32::sin", reason = "use libm::sinf: the platform's maths differs between systems" },
    { path = "f32::cos", reason = "use libm::cosf: the platform's maths differs between systems" },
    { path = "f32::tan", reason = "use libm::tanf: the platform's maths differs between systems" },
    { path = "f32::sin_cos", reason = "use libm::sincosf: the platform's maths differs between systems" },
    { path = "f32::asin", reason = "use libm::asinf: the platform's maths differs between systems" },
    { path = "f32::acos", reason = "use libm::acosf: the platform's maths differs between systems" },
    { path = "f32::atan", reason = "use libm::atanf: the platform's maths differs between systems" },
    { path = "f32::atan2", reason = "use libm::atan2f: the platform's maths differs between systems" },
    { path = "f32::sinh", reason = "use libm::sinhf: the platform's maths differs between systems" },
    { path = "f32::cosh", reason = "use libm::coshf: the platform's maths differs between systems" },
    { path = "f32::tanh", reason = "use libm::tanhf: the platform's maths differs between systems" },
    { path = "f32::asinh", reason = "use libm::asinhf: the platform's maths differs between systems" },
    { path = "f32::acosh", reason = "use libm::acoshf: the platform's maths differs between systems" },
    { path = "f32::atanh", reason = "use libm::atanhf: the platform's maths differs between systems" },
    { path = "f32::exp", reason = "use libm::expf: the platform's maths differs between systems" },
    { path = "f32::exp2", reason = "use libm::exp2f: the platform's maths differs between systems" },
    { path = "f32::exp_m1", reason = "use libm::expm1f: the platform's maths differs between systems" },
    { path = "f32::ln", reason = "use libm::logf: the platform's maths differs between systems" },
    { path = "f32::log", reason = "use libm::logf and divide: the platform's maths differs between systems" },
    { path = "f32::log2", reason = "use libm::log2f: the platform's maths differs between systems" },
    { path = "f32::log10", reason = "use libm::log10f: the platform's maths differs between systems" },
    { path = "f32::ln_1p", reason = "use libm::log1pf: the platform's maths differs between systems" },
    { path = "f32::powf", reason = "use libm::powf: the platform's maths differs between systems" },
    { path = "f32::powi", reason = "platform powi has unspecified precision: multiply, or use libm::powf" },
    { path = "f32::cbrt", reason = "use libm::cbrtf: the platform's maths differs between systems" },
    { path = "f32::hypot", reason = "use libm::hypotf: the platform's maths differs between systems" },
    { path = "f32::mul_add", reason = "without hardware FMA this calls the platform's fma, and the pages are checked byte for byte" },
    { path = "f64::algebraic_add", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f64::algebraic_sub", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f64::algebraic_mul", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f64::algebraic_div", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f64::algebraic_rem", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f32::algebraic_add", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f32::algebraic_sub", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f32::algebraic_mul", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f32::algebraic_div", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
    { path = "f32::algebraic_rem", reason = "may fuse or reassociate: the same inputs may give different results even within one run" },
]
