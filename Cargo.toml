[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
hyperion-protocol = { path = "crates/hyperion-protocol" }
hyperion-sim = { path = "crates/hyperion-sim" }
hyperion-testkit = { path = "crates/hyperion-testkit" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
criterion = { version = "0.8.2", default-features = false }
futures-util = "0.3.34"
# `OsEntropy` is the only user; nothing else sees its API, which changed between 0.3 and 0.4.
getrandom = "0.4.3"
# Pinned exactly: libm is reproducible across platforms but not across its own versions, so a bump
# is a generator-version change. `arch` is off so that there is one code path to reason about.
libm = { version = "=0.2.16", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# ts-rs cannot read `#[serde(try_from)]` or `#[serde(transparent)]` and warns at every build; the
# types that use them carry a `#[ts(type)]` override or are newtypes, which already say the binding.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Slow statistical tests (`just test-slow`): release speed, but with the debug assertions and
# overflow checks that the sim's bound checks rely on.
[profile.slow-test]
inherits = "release"
debug-assertions = true
overflow-checks = true
